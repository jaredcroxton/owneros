<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workforce · OwnerOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%23ff6b4a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230b0e13'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    --bg: #0b0e13; --panel: rgba(18,21,28,.66); --card: rgba(23,27,35,.55);
    --card-solid: #171b23; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.05);
    --hover: rgba(255,255,255,.16);
    --text: #eceef2; --mut: #9aa2b1; --faint: #8b93a5;
    --accent: #ff6b4a; --accent-soft: rgba(255,107,74,.16);
    --accent-edge: rgba(255,107,74,.5); --accent-glow: rgba(255,107,74,.32);
    --ok: #2dd4a7; --warn: #e8b931; --bad: #ef5350; --info: #4a9eff;
    --blur: blur(18px) saturate(1.25);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Inter, sans-serif; font-size: 14px;
    height: 100vh; overflow: hidden;
    display: grid; grid-template-columns: 208px 1fr;
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  a { color: inherit; text-decoration: none; }
  aside {
    background: var(--panel); backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-right: 1px solid var(--line);
    padding: 22px 14px; display: flex; flex-direction: column; gap: 4px;
    height: 100vh; z-index: 5;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px;
          font-weight: 700; font-size: 17px; letter-spacing: -.3px; }
  .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
                display: grid; place-items: center; box-shadow: 0 0 18px var(--accent-glow); }
  .logo .mark span { width: 12px; height: 12px; border-radius: 50%; background: var(--bg); }
  .logo em { font-style: normal; color: var(--accent); }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px;
    border-radius: 10px; color: var(--mut); font-weight: 500; font-size: 13.5px;
    border: 1px solid transparent; transition: color .15s, background .15s;
  }
  .nav-item:hover { color: var(--text); background: var(--card); }
  .nav-item.here { color: var(--text); background: var(--card);
                   border-color: var(--accent-edge);
                   box-shadow: 0 0 14px rgba(255,107,74,.14); }
  .nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none;
                  stroke-width: 1.7; flex-shrink: 0; }
  .side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line);
               display: grid; gap: 8px; }
  .sf-row { display: flex; align-items: center; gap: 8px; font-size: 11px;
            color: var(--faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--bad); }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh;
         position: relative; }
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            padding: 12px 24px;
            background: var(--panel); backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--line); z-index: 4; }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .datechip { font-size: 11px; color: var(--mut); background: var(--card);
              border: 1px solid var(--line); border-radius: 100px; padding: 6px 14px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            margin-left: auto;
            background: linear-gradient(135deg, var(--accent), #b3401f);
            display: grid; place-items: center; font-weight: 700; font-size: 14px;
            color: #fff; }
  .viewport { flex: 1; min-height: 0; }
  .viewport iframe { width: 100%; height: 100%; border: 0; display: block;
                     background: var(--bg); }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(3,5,9,.72);
           opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 31;
    width: min(520px, 94vw); background: var(--panel);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(0,0,0,.5);
    transform: translateX(102%); transition: transform .32s cubic-bezier(.2,.9,.3,1);
    display: flex; flex-direction: column; padding: 24px 26px; overflow-y: auto;
  }
  .drawer.open { transform: none; }
  .d-head { display: flex; align-items: flex-start; gap: 12px; }
  .d-head h2 { font-family: "JetBrains Mono", monospace; font-size: 15px;
               font-weight: 700; flex: 1; overflow-wrap: anywhere; }
  .xbtn { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
          background: rgba(255,255,255,.05); border: 1px solid var(--line);
          color: var(--mut); cursor: pointer; font-size: 13px; }
  .xbtn:hover { color: var(--text); border-color: var(--hover); }
  .d-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            margin: 10px 0 16px; }
  .pill { font-size: 10.5px; font-weight: 600; padding: 4px 11px;
          border-radius: 100px; text-transform: uppercase; letter-spacing: .6px;
          font-family: "JetBrains Mono", monospace; }
  .pill.ready { border: 1px solid var(--line); color: var(--faint); }
  .pill.live { background: rgba(45,212,167,.13); color: var(--ok);
               border: 1px solid rgba(45,212,167,.4); }
  .pill.active { background: var(--accent-soft); color: var(--accent);
                 border: 1px solid var(--accent-edge); }
  .pill.pack { border: 1px solid var(--line); color: var(--mut);
               text-transform: none; letter-spacing: 0; }
  .d-desc { font-size: 13.5px; line-height: 1.65; color: var(--mut);
            margin-bottom: 16px; }
  .money { background: var(--accent-soft); border: 1px solid var(--accent-edge);
           border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .money .ml { font-size: 10px; font-weight: 700; letter-spacing: 1px;
               text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .money .role { font-weight: 700; font-size: 14.5px; }
  .money .sal { font-family: "JetBrains Mono", monospace; font-size: 18px;
                font-weight: 700; color: var(--accent); margin: 6px 0; }
  .money .note { font-size: 12.5px; color: var(--mut); line-height: 1.55; }
  .d-sec { margin-bottom: 14px; }
  .d-sec .dl { font-size: 11px; font-weight: 700; letter-spacing: .8px;
               text-transform: uppercase; color: var(--mut); margin-bottom: 7px; }
  .rung { display: flex; gap: 10px; padding: 7px 0; font-size: 12.5px;
          line-height: 1.5; border-top: 1px solid var(--line2); }
  .rung .rl { font-family: "JetBrains Mono", monospace; font-size: 9px;
              letter-spacing: .5px; color: var(--faint); text-transform: uppercase;
              flex-shrink: 0; width: 82px; padding-top: 2px; }
  .d-human { font-size: 12.5px; color: var(--mut); line-height: 1.55;
             border-left: 3px solid var(--ok); padding-left: 12px; }
  .btn { font-size: 12px; font-weight: 600; background: var(--accent); color: #fff;
         border: 0; border-radius: 100px; padding: 10px 20px; cursor: pointer;
         transition: opacity .15s; }
  .btn:hover { opacity: .88; }
  .pending { font-size: 12px; color: var(--faint); padding: 10px 0; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap;
            align-items: center; border-right: 0;
            border-bottom: 1px solid var(--line); }
    .logo { padding: 0 8px 0 0; } .side-foot { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>
</head>
<body>
<aside>
  <div class="logo"><span class="mark"><span></span></span>Owner<em>OS_</em></div>
  <a class="nav-item" href="/today">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Today</a>
  <a class="nav-item" href="/projects">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Projects</a>
  <a class="nav-item" href="/brain">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg>
    Brain</a>
  <a class="nav-item" href="/capture">
    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><rect x="4" y="17" width="16" height="4" rx="1.5"/></svg>
    Capture</a>
  <a class="nav-item here" href="/launch">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="2.5"/><circle cx="5" cy="17" r="2.5"/><circle cx="19" cy="17" r="2.5"/><path d="M12 8.5V12m0 0-5 3m5-3 5 3"/></svg>
    Workforce</a>
  <a class="nav-item" href="/plays">
    <svg viewBox="0 0 24 24"><path d="M4 4h12a2 2 0 0 1 2 2v14l-4-3-4 3-4-3-2 1.5V6a2 2 0 0 1 2-2z"/><path d="M8 9h6M8 13h4"/></svg>
    Plays</a>
  <a class="nav-item" href="/files">
    <svg viewBox="0 0 24 24"><path d="M13 3H6a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V9z"/><path d="M13 3v6h6.5"/></svg>
    Files</a>
  <a class="nav-item" href="/roadmap">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 17c5-3 11 3 16 0M4 9c5-3 11 3 16 0"/></svg>
    Roadmap</a>
  <div class="side-foot">
    <div class="sf-row"><span class="dot" id="brainDot"></span><span id="brainState">brain: checking</span></div>
    <div class="sf-row"><span class="dot ok"></span>your AI staff, mapped</div>
  </div>
</aside>
<main>
  <div class="topbar">
    <h1>Workforce</h1>
    <span class="datechip mono" id="countChip">loading…</span>
    <span class="avatar">J</span>
  </div>
  <div class="viewport"><iframe id="mapFrame" src="/workforce-map/index.html"
    title="Workforce map"></iframe></div>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="d-head"><h2 id="dName"></h2>
    <button class="xbtn" id="dClose" type="button" aria-label="Close">✕</button></div>
  <div class="d-meta">
    <span class="pill" id="dStatus"></span>
    <span class="pill pack" id="dPack"></span>
    <span class="pill pack" id="dRuns" hidden></span>
  </div>
  <div class="d-desc" id="dDesc"></div>
  <div class="money" id="dMoney" hidden>
    <div class="ml">What this replaces</div>
    <div class="role" id="dRole"></div>
    <div class="sal" id="dSal"></div>
    <div class="note" id="dNote"></div>
  </div>
  <div class="d-sec" id="dLadderSec" hidden>
    <div class="dl">The trust ladder</div>
    <div class="rung"><span class="rl">Human-led</span><span id="dL1"></span></div>
    <div class="rung"><span class="rl">Assisted</span><span id="dL2"></span></div>
    <div class="rung"><span class="rl">Autonomous</span><span id="dL3"></span></div>
  </div>
  <div class="d-sec" id="dHumanSec" hidden>
    <div class="dl">What stays yours</div>
    <div class="d-human" id="dHuman"></div>
  </div>
  <div class="pending" id="dPending" hidden>Dossier pending.</div>
  <div style="margin-top:auto;padding-top:16px">
    <button class="btn" id="dCopy" type="button">Copy invoke phrase</button>
  </div>
</aside>
<script>
  const copy = (text, btn) => navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }).then(() => {
    const old = btn.textContent; btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = old; }, 1200);
  });

  fetch("/api/health").then((r) => r.json()).then((h) => {
    document.getElementById("brainDot").className = "dot " + (h.brain ? "ok" : "bad");
    document.getElementById("brainState").textContent =
      h.brain ? "brain: live on 4880" : "brain: offline";
  }).catch(() => {
    document.getElementById("brainState").textContent = "brain: offline";
  });

  let data = null, current = null;
  const index = {};

  async function load() {
    try {
      data = await (await fetch("/api/workforce")).json();
      const working = data.packs.reduce((a, p) =>
        a + p.skills.filter((s) => s.status !== "ready").length, 0);
      document.getElementById("countChip").textContent =
        data.total + " roles · " + working + " have worked for you";
      data.packs.forEach((p) => p.skills.forEach((s) =>
        index[s.name] = { skill: s, pack: p.label }));
    } catch (e) {
      document.getElementById("countChip").textContent = "workforce offline";
    }
    window.__ready = true;
  }
  load();

  window.addEventListener("message", (ev) => {
    const id = ev.data && ev.data.owneros_role;
    if (!id || !index[id]) return;
    openSkill(id);
  });

  function openSkill(name) {
    const entry = index[name];
    const s = entry.skill;
    current = s;
    document.getElementById("dName").textContent = s.invoke || s.name;
    document.getElementById("dPack").textContent = entry.pack;
    const st = document.getElementById("dStatus");
    st.className = "pill " + s.status;
    st.textContent = s.status === "active" ? "worked this month" :
      s.status === "live" ? "has worked for you" : "ready to work";
    const runs = document.getElementById("dRuns");
    runs.hidden = !s.runs;
    runs.textContent = s.runs + " job" + (s.runs === 1 ? "" : "s") + " filed";
    document.getElementById("dDesc").textContent = s.description;
    const d = s.dossier;
    document.getElementById("dMoney").hidden = !d;
    document.getElementById("dLadderSec").hidden = !d;
    document.getElementById("dHumanSec").hidden = !d;
    document.getElementById("dPending").hidden = !!d;
    if (d) {
      document.getElementById("dRole").textContent = d.replaces_role;
      document.getElementById("dSal").textContent = d.replaces_salary;
      document.getElementById("dNote").textContent = d.replaces_note;
      document.getElementById("dL1").textContent = d.ladder_human_led;
      document.getElementById("dL2").textContent = d.ladder_assisted;
      document.getElementById("dL3").textContent = d.ladder_autonomous;
      document.getElementById("dHuman").textContent = d.human;
    }
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawer").setAttribute("aria-hidden", "false");
    document.getElementById("scrim").classList.add("on");
  }

  function closeDrawer() {
    const drawer = document.getElementById("drawer");
    if (drawer.contains(document.activeElement)) document.activeElement.blur();
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    document.getElementById("scrim").classList.remove("on");
  }
  document.getElementById("dClose").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
  });
  document.getElementById("dCopy").addEventListener("click", (e) => {
    if (current) copy(current.invoke || "/" + current.name, e.target);
  });
</script>
<script>fetch("/api/owner").then(function(r){return r.json()}).then(function(o){
  document.querySelectorAll(".avatar").forEach(function(a){a.textContent=o.initial;});
  var g=document.getElementById("ownerName"); if(g) g.textContent=o.name;
}).catch(function(){});</script>
</body>
</html>
