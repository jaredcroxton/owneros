<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files · OwnerOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ffffff; --band: #f5f5f7; --navbg: rgba(250,250,252,.8);
    --wash: #e8e8ed; --hairline: #d6d6d6;
    --ink: #1d1d1f; --mid: #707070; --deep: #474747;
    --blue: #0071e3; --link: #0066cc; --ember: #b64400;
    --text: #1d1d1f; --mut: #707070; --faint: #707070;
    --accent: #b64400; --ok: #1d1d1f; --line: #d6d6d6;
  }
  * { margin: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui,
      "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.47; letter-spacing: -.022em;
    min-height: 100%;
  }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
          font-variant-numeric: tabular-nums; letter-spacing: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; letter-spacing: inherit; color: inherit;
           background: none; border: 0; cursor: pointer; padding: 0;
           text-align: left; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px;
                   border-radius: 4px; }
  .gnav { position: sticky; top: 0; z-index: 50; height: 44px;
          background: var(--navbg);
          backdrop-filter: blur(20px) saturate(1.8);
          -webkit-backdrop-filter: blur(20px) saturate(1.8); }
  .gnav-in { max-width: 1024px; margin: 0 auto; height: 100%;
             display: flex; align-items: center; gap: 28px; padding: 0 22px; }
  .gnav .word { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .gnav .word em { font-style: normal; color: var(--mid); font-weight: 400; }
  .gnav .links { display: flex; gap: 26px; margin: 0 auto; overflow-x: auto;
                 scrollbar-width: none; }
  .gnav .links::-webkit-scrollbar { display: none; }
  .gnav .links a { font-size: 12px; color: rgba(29,29,31,.8);
                   white-space: nowrap; transition: color .15s; }
  .gnav .links a:hover { color: var(--ink); }
  .gnav .links a.here { color: var(--ink); font-weight: 600; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid var(--ink); display: grid; place-items: center;
            font-size: 12px; font-weight: 600; }
  .band { padding: 72px 22px; }
  .band.gray { background: var(--band); }
  .band-in { max-width: 980px; margin: 0 auto; }
  .hero { text-align: center; padding-top: 64px; padding-bottom: 36px; }
  .datechip { font-family: ui-monospace, "SF Mono", Menlo, monospace;
              font-size: 12px; letter-spacing: .06em;
              text-transform: uppercase; color: var(--mid); }
  .page-hero h2 { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
                  font-size: clamp(40px, 6.5vw, 72px); line-height: 1.05;
                  font-weight: 700; letter-spacing: -.015em; margin-top: 14px; }
  .page-hero .cursor { color: var(--mid); font-weight: 400; }
  .roots { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
  .root-pill { font-size: 14px; padding: 9px 20px; border-radius: 980px;
               background: var(--band); color: var(--deep);
               transition: background .15s, color .15s; }
  .root-pill:hover { background: var(--wash); }
  .root-pill.on { background: var(--ink); color: #fff; }
  .crumbs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
            margin-top: 18px; font-size: 14px; color: var(--mid); }
  .crumbs button { color: var(--link); }
  .crumbs button:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--hairline); }
  .askbar { display: flex; gap: 10px; max-width: 640px; margin: 26px auto 0; }
  .askbar input { flex: 1; border: 0; background: var(--band);
                  border-radius: 980px; padding: 12px 22px; font: inherit;
                  font-size: 15px; outline: none; transition: background .15s; }
  .askbar input:focus { background: var(--wash); }
  .askbar input::placeholder { color: var(--mid); }
  .btn { background: var(--blue); color: #fff; border-radius: 980px;
         padding: 10px 22px; font-size: 15px; transition: background .15s;
         text-align: center; }
  .btn:hover { background: #0077ed; }
  .btn.ghost { background: transparent; color: var(--ink);
               border: 1px solid rgba(29,29,31,.8); }
  .btn.ghost:hover { background: var(--wash); }
  .btn.mini { font-size: 12px; padding: 6px 14px; }
  .answer { position: relative; max-width: 760px; margin: 22px auto 0;
            background: var(--band); border-radius: 18px; padding: 18px 44px 18px 22px;
            font-size: 15px; line-height: 1.55; color: var(--deep);
            display: none; text-align: left; }
  .answer.on { display: block; }
  .answer .tag { display: block; font-family: ui-monospace, "SF Mono", Menlo, monospace;
                 font-size: 10px; letter-spacing: .08em; color: var(--mid);
                 margin-bottom: 6px; }
  .answer .x { position: absolute; top: 12px; right: 14px; color: var(--mid);
               font-size: 16px; }
  .protect-note { display: none; font-size: 13px; color: var(--ember);
                  margin-bottom: 14px; }
  .protect-note.on { display: block; }
  .vault { max-width: 980px; margin: 0 auto; }
  .frow { display: flex; align-items: center; gap: 14px;
          background: var(--paper); border-radius: 14px; padding: 13px 18px;
          margin-bottom: 8px; }
  .frow > svg { width: 18px; height: 18px; flex-shrink: 0;
                stroke: var(--mid); fill: none; stroke-width: 1.7; }
  .frow.dir > svg { stroke: var(--link); }
  .frow.dir .fname { color: var(--link); cursor: pointer; }
  .fname { font-size: 15px; font-weight: 500; letter-spacing: -.01em;
           overflow-wrap: anywhere; min-width: 0; flex: 1; }
  .meta { font-family: ui-monospace, "SF Mono", Menlo, monospace;
          font-size: 11px; color: var(--mid); white-space: nowrap; }
  .lock { font-size: 11px; color: var(--ember); }
  .acts { display: flex; gap: 8px; opacity: 0; transition: opacity .15s; }
  .frow:hover .acts, .frow:focus-within .acts { opacity: 1; }
  .mover { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           margin-top: 8px; }
  .empty { color: var(--mid); padding: 22px 0; text-align: center; }
  .search { display: flex; align-items: center; gap: 8px;
            justify-content: center; margin-top: 16px; }
  .search svg { width: 15px; height: 15px; stroke: var(--mid); fill: none;
                stroke-width: 1.8; }
  .search input { border: 0; border-bottom: 1px solid var(--hairline);
                  background: none; outline: none; font: inherit;
                  font-size: 14px; padding: 6px 2px; width: 210px;
                  transition: border-color .15s; }
  .search input:focus { border-bottom-color: var(--ink); }
  .search input::placeholder { color: var(--mid); }
  .foot { display: flex; align-items: center; justify-content: center;
          gap: 20px; padding: 26px 22px 40px; font-size: 12px;
          color: var(--mid); flex-wrap: wrap; }
  .sf-row { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--ink); }
  .dot.bad { background: var(--ember); }
  .stage { display: none !important; }
  @media (max-width: 720px) {
    .band { padding: 48px 16px; }
    .acts { opacity: 1; }
  }
  .glass.composer, .goal, .row, .dept, .roles-panel, .cat, .chain, .frow {
    box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 14px 34px rgba(0,0,0,.05); }

</style>
</head>
<body>
<div class="stage" id="stage" hidden><img src="/assets/strata.webp" alt="" id="stageImg"></div>
<nav class="gnav">
  <div class="gnav-in">
    <span class="word">OwnerOS<em>_</em></span>
    <div class="links">
      <a href="/today">Today</a>
      <a href="/projects">Projects</a>
      <a href="/brain">Brain</a>
      <a href="/capture">Capture</a>
      <a href="/launch">Workforce</a>
      <a href="/plays">Plays</a>
      <a class="here" href="/files" aria-current="page">Files</a>
      <a href="/roadmap">Roadmap</a>
    </div>
    <span class="avatar">J</span>
  </div>
</nav>
<main>
  <section class="band hero">
    <div class="band-in">
      <div class="datechip mono" id="dateChip"></div>
      <div class="page-hero"><h2>Everything, findable<span class="cursor">_</span></h2></div>
      <div class="roots">
        <button class="root-pill on" data-root="desktop" type="button">Desktop</button>
        <button class="root-pill" data-root="captures" type="button">Captures inbox</button>
      </div>
      <div class="crumbs" id="crumbs"></div>
      <div class="askbar">
        <input id="askInput" type="text" aria-label="Ask about this folder"
               placeholder="Ask about this folder… e.g. what can be archived, what needs renaming">
        <button class="btn" id="askBtn" type="button">Ask</button>
      </div>
      <div class="answer" id="answer"><button class="x" id="answerX" type="button">×</button>
        <span class="tag">FILES ASSISTANT</span><span id="answerText"></span></div>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="filter" type="search" placeholder="Filter this folder…" aria-label="Filter files"></label>

      <div class="glass vault">
        <div class="protect-note" id="protectNote">This folder is write-protected
          (build-critical). Browsing only.</div>
        <div id="listing"><div class="empty">Reading…</div></div>
      </div>
    </div>
  </section>
</main>
<div class="foot">
  <span class="sf-row"><span class="dot" id="brainDot"></span><span id="brainState">brain: checking</span></span>
  <span class="sf-row"><span class="dot ok"></span>safe zones · cabinet read-only</span>
</div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  fetch("/assets/strata-loop.mp4", { method: "HEAD" }).then((r) => {
    if (!r.ok) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const v = document.createElement("video");
    v.src = "/assets/strata-loop.mp4"; v.autoplay = true; v.muted = true;
    v.loop = true; v.playsInline = true; v.poster = "/assets/strata.webp";
    const img = document.getElementById("stageImg");
    v.addEventListener("canplay", () => {
      document.getElementById("stage").insertBefore(v, img); img.remove();
    }, { once: true });
  }).catch(() => {});

  const state = { root: "desktop", path: "", data: null, filter: "" };

  const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + " MB"
    : b > 1024 ? Math.round(b / 1024) + " KB" : b + " B";
  const FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const FILE = '<svg viewBox="0 0 24 24"><path d="M13 3H6a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V9z"/><path d="M13 3v6h6.5"/></svg>';

  function toast(msg, bad) {
    const t = document.createElement("div");
    t.className = "toast" + (bad ? " bad" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add("on"), 20);
    setTimeout(() => { t.classList.remove("on");
      setTimeout(() => t.remove(), 400); }, 3600);
  }

  async function post(url, payload) {
    const resp = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || data.ok === false)
      throw new Error(data.error || "Request failed");
    return data;
  }

  function crumbs() {
    const parts = state.path ? state.path.split("/") : [];
    let html = '<button data-go="">' + (state.root === "desktop" ?
      "~/Desktop" : "captures") + "</button>";
    let acc = [];
    for (const p of parts) {
      acc.push(p);
      html += ' / <button data-go="' + esc(acc.join("/")) + '">' + esc(p) + "</button>";
    }
    document.getElementById("crumbs").innerHTML = html;
    document.querySelectorAll("#crumbs button").forEach((b) =>
      b.addEventListener("click", () => { state.path = b.dataset.go; load(); }));
  }

  function render() {
    const d = state.data;
    document.getElementById("protectNote").classList.toggle("on", d.protected);
    const q = state.filter;
    const dirs = d.dirs.filter((x) => !q || x.name.toLowerCase().includes(q));
    const files = d.files.filter((x) => !q || x.name.toLowerCase().includes(q));
    const acts = (name, locked) =>
      '<span class="acts">' + (d.protected || locked ? "" :
      '<button class="btn ghost mini" data-rn="' + esc(name) +
      '">Rename</button><button class="btn ghost mini" data-mv="' + esc(name) +
      '">Move</button>') + '<button class="btn ghost mini" data-rv="' + esc(name) +
      '">Reveal</button></span>';
    let i = 0;
    const delay = () => ' style="animation-delay:' + Math.min(i++ * 30, 360) + 'ms"';
    const rows =
      dirs.map((x) => '<div class="frow dir"' + delay() + '>' + FOLDER +
        '<span class="fname" data-open="' + esc(x.name) + '">' + esc(x.name) +
        "</span>" + (x.protected ? '<span class="lock">protected</span>' : "") +
        acts(x.name, x.protected) + "</div>").join("") +
      files.map((x) => '<div class="frow"' + delay() + '>' + FILE +
        '<span class="fname">' + esc(x.name) + '</span><span class="meta">' +
        fmtSize(x.size) + " · " + (x.days === 0 ? "today" : x.days + "d") +
        "</span>" + acts(x.name, false) + "</div>").join("");
    document.getElementById("listing").innerHTML =
      rows || '<div class="empty">' + (q ? "No match here." : "Empty folder.") + "</div>";

    document.querySelectorAll("[data-open]").forEach((el) =>
      el.addEventListener("click", () => {
        state.path = (state.path ? state.path + "/" : "") + el.dataset.open;
        load();
      }));
    document.querySelectorAll("[data-rv]").forEach((b) =>
      b.addEventListener("click", () =>
        post("/api/files/reveal", { root: state.root,
          path: (state.path ? state.path + "/" : "") + b.dataset.rv })
          .then(() => toast("Revealed in Finder."))
          .catch((e) => toast(e.message, true))));
    document.querySelectorAll("[data-rn]").forEach((b) =>
      b.addEventListener("click", () => startRename(b.dataset.rn, b)));
    document.querySelectorAll("[data-mv]").forEach((b) =>
      b.addEventListener("click", () => startMove(b.dataset.mv, b)));
  }

  function startRename(name, btn) {
    const row = btn.closest(".frow");
    const fname = row.querySelector(".fname");
    const input = document.createElement("input");
    input.className = "rn"; input.value = name;
    fname.replaceWith(input); input.focus();
    input.setSelectionRange(0, name.lastIndexOf(".") > 0 ?
      name.lastIndexOf(".") : name.length);
    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      if (commit && input.value.trim() && input.value !== name) {
        post("/api/files/rename", { root: state.root,
          path: (state.path ? state.path + "/" : "") + name,
          new_name: input.value.trim() })
          .then(() => { toast("Renamed to " + input.value.trim()); load(); })
          .catch((e) => { toast(e.message, true); load(); });
      } else load();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(false));
  }

  function startMove(name, btn) {
    const row = btn.closest(".frow");
    const acts = row.querySelector(".acts");
    const options = [];
    if (state.path) options.push({ v: state.path.split("/").slice(0, -1).join("/"),
                                   t: ".. (up one)" });
    state.data.dirs.filter((d) => d.name !== name && !d.protected).forEach((d) =>
      options.push({ v: (state.path ? state.path + "/" : "") + d.name,
                     t: d.name + "/" }));
    if (!options.length) { toast("No destination folders here.", true); return; }
    acts.innerHTML = '<span class="mover"><select>' +
      options.map((o) => '<option value="' + esc(o.v) + '">' + esc(o.t) +
        "</option>").join("") +
      '</select><button class="btn mini" type="button">Go</button>' +
      '<button class="btn ghost mini" type="button">×</button></span>';
    acts.style.opacity = 1;
    const [sel, go, x] = acts.querySelectorAll("select, button");
    go.addEventListener("click", () =>
      post("/api/files/move", { root: state.root,
        path: (state.path ? state.path + "/" : "") + name,
        dest_root: state.root, dest_path: sel.value })
        .then(() => { toast("Moved " + name); load(); })
        .catch((e) => { toast(e.message, true); load(); }));
    x.addEventListener("click", load);
  }

  async function load() {
    crumbs();
    try {
      const resp = await fetch("/api/files?root=" + state.root + "&path=" +
        encodeURIComponent(state.path));
      if (!resp.ok) throw new Error("not a safe zone");
      state.data = await resp.json();
      render();
    } catch (e) {
      document.getElementById("listing").innerHTML =
        '<div class="empty">Could not read this folder: ' + esc(e.message) + "</div>";
    }
    window.__ready = true;
  }

  document.querySelectorAll(".root-pill").forEach((b) =>
    b.addEventListener("click", () => {
      document.querySelectorAll(".root-pill").forEach((x) =>
        x.classList.toggle("on", x === b));
      state.root = b.dataset.root; state.path = ""; state.filter = "";
      document.getElementById("filter").value = "";
      load();
    }));
  document.getElementById("filter").addEventListener("input", (e) => {
    state.filter = e.target.value.trim().toLowerCase();
    if (state.data) render();
  });

  const askBtn = document.getElementById("askBtn");
  askBtn.addEventListener("click", async () => {
    const q = document.getElementById("askInput").value.trim();
    if (!q) return;
    askBtn.disabled = true; askBtn.textContent = "Thinking…";
    try {
      const d = await post("/api/files/ask", { root: state.root,
        path: state.path, question: q });
      document.getElementById("answerText").textContent = d.answer;
      document.getElementById("answer").classList.add("on");
    } catch (e) { toast(e.message, true); }
    askBtn.disabled = false; askBtn.textContent = "Ask";
  });
  document.getElementById("askInput").addEventListener("keydown",
    (e) => { if (e.key === "Enter") askBtn.click(); });
  document.getElementById("answerX").addEventListener("click",
    () => document.getElementById("answer").classList.remove("on"));

  document.getElementById("dateChip").textContent =
    new Date().toLocaleDateString("en-AU",
      { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  fetch("/api/health").then((r) => r.json()).then((h) => {
    document.getElementById("brainDot").className = "dot " + (h.brain ? "ok" : "bad");
    document.getElementById("brainState").textContent =
      h.brain ? "brain: live on 4880" : "brain: offline";
  }).catch(() => {
    document.getElementById("brainState").textContent = "brain: offline";
  });

  load();
</script>
<script>fetch("/api/owner").then(function(r){return r.json()}).then(function(o){
  document.querySelectorAll(".avatar").forEach(function(a){a.textContent=o.initial;});
  var g=document.getElementById("ownerName"); if(g) g.textContent=o.name;
}).catch(function(){});</script>
</body>
</html>
