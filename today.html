<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · OwnerOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ffffff; --band: #f5f5f7; --navbg: rgba(250,250,252,.8);
    --wash: #e8e8ed; --hairline: #d6d6d6;
    --ink: #1d1d1f; --mid: #707070; --deep: #474747;
    --blue: #0071e3; --link: #0066cc; --ember: #b64400;
    /* legacy var names the feature JS colors with */
    --text: #1d1d1f; --mut: #707070; --faint: #707070;
    --accent: #b64400; --ok: #1d1d1f; --warn: #707070; --bad: #b64400;
    --line: #d6d6d6;
  }
  * { margin: 0; box-sizing: border-box; }
  html { height: 100%; scroll-behavior: smooth; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui,
      "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.47; letter-spacing: -.022em;
    min-height: 100%;
  }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
          font-variant-numeric: tabular-nums; letter-spacing: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; letter-spacing: inherit; color: inherit;
           background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px;
                   border-radius: 4px; }

  /* ---- global nav ---- */
  .gnav { position: sticky; top: 0; z-index: 50; height: 44px;
          background: var(--navbg);
          backdrop-filter: blur(20px) saturate(1.8);
          -webkit-backdrop-filter: blur(20px) saturate(1.8); }
  .gnav-in { max-width: 1024px; margin: 0 auto; height: 100%;
             display: flex; align-items: center; gap: 28px; padding: 0 22px; }
  .gnav .word { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .gnav .word em { font-style: normal; color: var(--mid); font-weight: 400; }
  .gnav .links { display: flex; gap: 26px; margin: 0 auto; overflow-x: auto;
                 scrollbar-width: none; }
  .gnav .links::-webkit-scrollbar { display: none; }
  .gnav .links a { font-size: 12px; color: rgba(29,29,31,.8);
                   letter-spacing: -.01em; white-space: nowrap;
                   transition: color .15s; }
  .gnav .links a:hover { color: var(--ink); }
  .gnav .links a.here { color: var(--ink); font-weight: 600; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid var(--ink); display: grid; place-items: center;
            font-size: 12px; font-weight: 600; color: var(--ink);
            background: transparent; }

  /* ---- bands ---- */
  .band { padding: 88px 22px; }
  .band.gray { background: var(--band); }
  .band-in { max-width: 980px; margin: 0 auto; }
  .band-in.wide { max-width: 1200px; }

  /* ---- hero ---- */
  .hero { text-align: center; padding-top: 72px; padding-bottom: 72px; }
  .hero.has-art {
    background:
      linear-gradient(rgba(255,255,255,.93) 0%, rgba(255,255,255,.78) 100%),
      url(/assets/apple/today.png) center / cover no-repeat;
    padding-bottom: 96px; }
  .eyebrow { font-family: ui-monospace, "SF Mono", Menlo, monospace;
             font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--mid); }
  .greet h2 { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
              font-size: clamp(48px, 7.5vw, 88px); line-height: 1.04;
              font-weight: 700; letter-spacing: -.015em; margin-top: 14px; }
  .greet .cursor { color: var(--mid); font-weight: 400; }
  .greet p { font-size: 21px; line-height: 1.38; letter-spacing: .01em;
             color: var(--mid); margin-top: 16px; }
  .err { color: var(--ember); }

  /* ---- stat row (JS renders .chip/.n/.l) ---- */
  .chips { display: flex; justify-content: center; align-items: flex-start;
           gap: 56px; flex-wrap: wrap; margin-top: 44px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 6px;
          animation: rise .5s cubic-bezier(.2,.7,.3,1) backwards; }
  .chip .n { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
             font-size: 48px; line-height: 1; font-weight: 600;
             letter-spacing: -.01em;
             font-variant-numeric: tabular-nums; }
  .chip .l { font-size: 14px; color: var(--mid); letter-spacing: -.01em; }
  #radarRow { margin-top: 28px; gap: 40px; }
  #radarRow .chip .n { font-size: 21px; font-weight: 600; }

  /* ---- cards ---- */
  .glass { background: var(--paper); border-radius: 28px; padding: 28px; }
  .band.gray .glass { box-shadow: none; }
  .band:not(.gray) .glass { box-shadow: 0 0 0 1px rgba(0,0,0,.06); }

  /* ---- buttons ---- */
  .btn { background: var(--blue); color: #fff; border-radius: 980px;
         padding: 10px 22px; font-size: 15px; font-weight: 400;
         letter-spacing: -.01em; transition: background .15s; }
  .btn:hover { background: #0077ed; }
  .btn.ghost { background: transparent; color: var(--ink);
               border: 1px solid rgba(29,29,31,.8); }
  .btn.ghost:hover { background: var(--wash); }

  /* ---- briefing card ---- */
  .brief { max-width: 780px; margin: 0 auto; }
  .brief-head { display: flex; align-items: center; gap: 16px;
                flex-wrap: wrap; }
  .brief-title { display: flex; align-items: center; gap: 14px; }
  .brock { width: 44px; height: 44px; border-radius: 50%; background: var(--ink);
           color: #fff; display: grid; place-items: center; font-size: 17px;
           font-weight: 600; flex-shrink: 0; }
  .bt { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
        font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .bm { font-size: 12px; color: var(--mid); margin-top: 2px; }
  .brief-acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .brief-body { margin-top: 22px; padding-top: 22px;
                border-top: 1px solid var(--wash);
                font-size: 17px; line-height: 1.6; color: var(--deep);
                white-space: pre-wrap; max-height: 420px; overflow-y: auto; }

  /* ---- needs-you line (pinFallback) ---- */
  #pinFallback .glass { max-width: 780px; margin: 0 auto 18px;
                        font-size: 17px; color: var(--deep);
                        padding: 18px 28px; }
  #pinFallback b { color: var(--ember); font-weight: 600; }

  /* ---- plate band ---- */
  .plate { display: block; width: 100%; max-width: 980px; margin: 0 auto;
           border-radius: 28px; }

  /* ---- recent projects ---- */
  .panel-title { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
                 font-size: 28px; font-weight: 600; letter-spacing: .007em; }
  .recent-head { display: flex; align-items: center; gap: 18px;
                 margin-bottom: 22px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .search svg { width: 15px; height: 15px; stroke: var(--mid); fill: none;
                stroke-width: 1.8; }
  .search input { border: 0; border-bottom: 1px solid var(--hairline);
                  background: none; outline: none; font: inherit;
                  font-size: 14px; padding: 6px 2px; color: var(--ink);
                  width: 200px; transition: border-color .15s; }
  .search input:focus { border-bottom-color: var(--ink); }
  .search input::placeholder { color: var(--mid); }
  .recent { padding: 0; background: none; box-shadow: none !important; }
  .row { display: flex; align-items: center; gap: 16px;
         background: var(--paper); border-radius: 18px; padding: 16px 22px;
         margin-bottom: 10px; }
  .band:not(.gray) .row { background: var(--band); }
  .pname { font-size: 17px; font-weight: 600; letter-spacing: -.01em;
           overflow-wrap: anywhere; }
  .psub { font-size: 14px; color: var(--mid); margin-top: 1px; }
  .flag { font-family: ui-monospace, "SF Mono", Menlo, monospace;
          font-size: 12px; color: var(--mid); white-space: nowrap; }
  .stat { display: inline-flex; align-items: center; gap: 8px;
          font-family: ui-monospace, "SF Mono", Menlo, monospace;
          font-size: 12px; color: var(--mid); white-space: nowrap; }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat.ok .dot { background: var(--ink); }
  .stat.hot .dot { background: var(--ember); }
  .stat.hot { color: var(--ember); }
  .stat.warn .dot { background: transparent; border: 1px solid var(--mid); }
  .stat.off .dot { background: transparent; border: 1px solid var(--hairline); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--ink); }
  .dot.bad { background: var(--ember); }

  /* ---- footer strip ---- */
  .foot { display: flex; align-items: center; justify-content: center;
          gap: 20px; padding: 26px 22px 40px; font-size: 12px;
          color: var(--mid); flex-wrap: wrap; }
  .sf-row { display: inline-flex; align-items: center; gap: 7px; }
  .foot .btn.ghost { font-size: 12px; padding: 6px 14px; }

  /* ---- toasts ---- */
  .toast { position: fixed; bottom: 28px; left: 50%; z-index: 60;
           background: var(--ink); color: #fff; border-radius: 980px;
           padding: 12px 24px; font-size: 14px; letter-spacing: -.01em;
           opacity: 0; transform: translate(-50%, 8px);
           transition: opacity .25s, transform .25s; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .chip.pulse { animation: pop .5s cubic-bezier(.2,.7,.3,1); }
  @keyframes pop { 30% { transform: scale(1.06); } }
  .toast b { font-weight: 600; }
  .toast a { color: #9bc9ff; }

  /* ---- chat sheet ---- */
  .chatveil { position: fixed; inset: 0; z-index: 70;
              background: rgba(0,0,0,.4); display: none;
              align-items: center; justify-content: center; padding: 20px; }
  .chatveil.on { display: flex; }
  .chatbox { width: min(560px, 96vw); max-height: 86vh; display: flex;
             flex-direction: column; background: var(--paper);
             border-radius: 28px; padding: 26px; box-shadow: none; }
  .chat-head { display: flex; align-items: center; gap: 14px; }
  .orb { width: 44px; height: 44px; border-radius: 50%; background: var(--ink);
         color: #fff; display: grid; place-items: center; font-weight: 600;
         flex-shrink: 0; transition: box-shadow .3s, background .3s; }
  .orb.listen { background: var(--blue);
                box-shadow: 0 0 0 6px rgba(0,113,227,.15);
                animation: breathe 1.6s ease-in-out infinite; }
  .orb.think { background: var(--mid); }
  .orb.speak { background: var(--ink);
               box-shadow: 0 0 0 6px rgba(29,29,31,.12);
               animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.07); } }
  .chat-status { font-size: 12px; color: var(--mid); }
  .chat-log { flex: 1; overflow-y: auto; margin: 18px 0; display: grid;
              gap: 12px; min-height: 120px; }
  .turn { font-size: 15px; line-height: 1.5; }
  .turn b { display: block; font-size: 11px; text-transform: uppercase;
            letter-spacing: .06em; color: var(--mid); margin-bottom: 3px;
            font-weight: 600; }
  .turn.you { text-align: right; }
  .turn.brock { text-align: left; }
  .chat-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
               padding-top: 14px; border-top: 1px solid var(--wash); }
  .chat-hint { font-size: 11px; color: var(--mid); margin-left: auto; }

  /* ---- retired stage/pins (kept as hidden stubs for the JS) ---- */
  .stage, .pins, .wires, .pin, .anchor { display: none !important; }

  /* ---- motion ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .rise { animation: rise .5s cubic-bezier(.2,.7,.3,1) backwards; }
  @media (prefers-reduced-motion: reduce) {
    .chip, .rise, .toast { animation: none; }
    .orb.listen, .orb.speak { animation: none; }
    html { scroll-behavior: auto; }
  }
  @media (max-width: 720px) {
    .band { padding: 56px 18px; }
    .chips { gap: 32px; }
    .chip .n { font-size: 36px; }
    .brief-acts { margin-left: 0; }
  }
  .hero .glass.brief { text-align: left; margin-top: 44px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 14px 34px rgba(0,0,0,.05); }
  .hero #pinFallback .glass { text-align: left;
    box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
  .foot { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage" hidden><img src="/assets/mind.webp" alt="" id="stageImg"></div>
<nav class="gnav">
  <div class="gnav-in">
    <span class="word">OwnerOS<em>_</em></span>
    <div class="links">
      <a class="here" href="/today" aria-current="page">Today</a>
      <a href="/projects">Projects</a>
      <a href="/brain">Brain</a>
      <a href="/capture">Capture</a>
      <a href="/launch">Workforce</a>
      <a href="/plays">Plays</a>
      <a href="/files">Files</a>
      <a href="/roadmap">Roadmap</a>
    </div>
    <span class="avatar">J</span>
  </div>
</nav>
<main>
  <section class="band hero has-art">
    <div class="band-in">
      <div class="eyebrow mono" id="dateChip"></div>
      <div class="greet">
        <h2>Hi, <span id="ownerName">Jared</span><span class="cursor">_</span></h2>
        <p id="subLine">reading the filing cabinet…</p>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chips" id="radarRow" style="display:none"></div>
      <div id="pinFallback" style="display:none"></div>
      <div class="glass brief">
        <div class="brief-head">
          <div class="brief-title"><span class="brock">B</span>
            <div><div class="bt">Brock</div>
            <div class="bm mono" id="briefMeta">not run yet today</div></div></div>
          <div class="brief-acts">
            <button class="btn ghost" id="askBrock" type="button">Chat</button>
            <button class="btn ghost" id="briefPlay" type="button" hidden>Play</button>
            <button class="btn" id="briefRun" type="button">Run briefing</button>
          </div>
        </div>
        <div class="brief-body" id="briefBody" hidden></div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="band-in">
      <div class="recent-head">
        <label class="search" style="margin-left:0"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="filter" type="search" placeholder="Filter projects…" aria-label="Filter projects"></label>
      </div>
      <div class="glass recent">
        <div id="recentList"></div>
      </div>
    </div>
  </section>
</main>

<div class="foot">
  <span class="sf-row"><span class="dot" id="brainDot"></span><span id="brainState">brain: checking</span></span>
  <span class="sf-row"><span class="dot ok"></span>local · cabinet read-only</span>
  <button class="btn ghost" id="snapBtn" type="button">Snapshot backup</button>
</div>

<div class="chatveil" id="chatVeil">
  <div class="chatbox">
    <div class="chat-head">
      <div class="orb" id="chatOrb">B</div>
      <div><div style="font-weight:600;font-size:17px">Brock</div>
        <div class="chat-status" id="chatStatus">ready</div></div>
      <button class="btn ghost" id="chatMicBtn" type="button"
              style="margin-left:auto">Speak</button>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-foot">
      <button class="btn ghost" id="chatNew" type="button">New conversation</button>
      <button class="btn" id="chatEnd" type="button">End chat</button>
      <span class="chat-hint">say "goodbye" to end · Esc closes</span>
    </div>
  </div>
</div>
<div class="pins" id="pins" hidden>
  <svg class="wires" id="wires"></svg>
</div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const human = (s) => (s || "no status").replace(/_/g, " ").toLowerCase();
  const copy = (text, btn) => navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }).then(() => {
    const old = btn.textContent; btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = old; }, 1200);
  });

  fetch("/assets/mind-loop.mp4", { method: "HEAD" }).then((r) => {
    if (!r.ok) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const v = document.createElement("video");
    v.src = "/assets/mind-loop.mp4"; v.autoplay = true; v.muted = true;
    v.loop = true; v.playsInline = true; v.poster = "/assets/mind.webp";
    const img = document.getElementById("stageImg");
    v.addEventListener("canplay", () => {
      document.getElementById("stage").insertBefore(v, img); img.remove();
      v.play().catch(() => {});
    }, { once: true });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) v.play().catch(() => {});
    });
  }).catch(() => {});

  const statCls = (s) => s === "DONE" ? "ok" : s === "BLOCKED" ||
    s === "READY FOR REVIEW" ? "hot" : s ? "warn" : "off";

  let recent = [];
  function renderRecent(q) {
    const list = recent.filter((p) => !q || p.name.toLowerCase().includes(q));
    document.getElementById("recentList").innerHTML = list.map((p) => {
      const cls = statCls(p.status);
      return '<div class="row"><div style="min-width:0;flex:1"><div class="pname">' +
        esc(p.name) + '</div><div class="psub">' +
        (p.kind === "loose" ? "unparsed record" : esc(p.skill || "no handoffs")) +
        '</div></div>' +
        (p.stale ? '<span class="flag">quiet ' + p.days + 'd</span>' : "") +
        '<span class="stat ' + cls + '"><span class="dot"></span>' +
        esc(human(p.status)) + " · " + p.days + "d</span></div>";
    }).join("") || '<div class="row" style="color:var(--faint)">No match.</div>';
  }
  document.getElementById("filter").addEventListener("input",
    (e) => renderRecent(e.target.value.trim().toLowerCase()));

  function chip(id, n, label, color, delay) {
    return '<div class="chip" id="' + id + '" style="animation-delay:' + delay +
      'ms"><span class="n" data-n="' + n + '" style="color:' + color + '">' +
      String(n).padStart(2, "0") + '</span><span class="l">' + label + "</span></div>";
  }

  const PIN_LAYOUT = [
    { key: "needs", x: .585, y: .12, ax: .72, ay: .37 },
    { key: "captures", x: .66, y: .60, ax: .725, ay: .505 },
    { key: "active", x: .82, y: .80, ax: .76, ay: .64 },
  ];

  function drawPins(d, instant) {
    const pins = document.getElementById("pins");
    pins.querySelectorAll(".pin, .anchor").forEach((n) => n.remove());
    const wires = document.getElementById("wires");
    wires.innerHTML = "";
    const W = window.innerWidth, H = window.innerHeight;
    const defs = {
      needs: d.needs_me.length ? {
        color: "var(--accent)",
        html: '<div class="pt"><span class="dot" style="background:var(--accent)"></span>Needs you</div>' +
          '<div class="name">' + esc(d.needs_me[0].project) + '</div>' +
          '<div class="why">' + esc(human(d.needs_me[0].status)) + " · " +
          d.needs_me[0].days + ' days · ' + esc(d.needs_me[0].skill) + '</div>' +
          '<button class="btn" type="button" data-resume="' +
          esc(d.needs_me[0].project) + '">Resume</button>',
      } : {
        color: "var(--ok)",
        html: '<div class="pt"><span class="dot" style="background:var(--ok)"></span>Needs you</div>' +
          '<div class="name">Clear runway</div>' +
          '<div class="why">Nothing is waiting on you.</div>',
      },
      captures: {
        color: "var(--ok)",
        html: '<div class="pt"><span class="dot" style="background:var(--ok)"></span>Captures</div>' +
          '<div class="val" id="capVal">' + String(d.captures || 0).padStart(2, "0") +
          '</div><div class="why">thoughts living in the Brain</div>',
      },
      active: {
        color: "var(--info)",
        html: '<div class="pt"><span class="dot" style="background:var(--info)"></span>Active</div>' +
          '<div class="name" style="font-size:12.5px">' + esc(d.active_project) +
          '</div><div class="why">' + esc(d.brand) + '</div>',
      },
    };
    PIN_LAYOUT.forEach((p, i) => {
      const def = defs[p.key];
      const el = document.createElement("div");
      el.className = "pin glass";
      el.id = "pin-" + p.key;
      el.style.left = Math.min(p.x * W, W - 290) + "px";
      el.style.top = p.y * H + "px";
      if (instant) { el.style.animation = "none"; el.style.opacity = "1"; }
      else el.style.animationDelay = (250 + i * 140) + "ms";
      el.innerHTML = def.html;
      pins.appendChild(el);
      const a = document.createElement("div");
      a.className = "anchor";
      a.style.left = p.ax * W - 6 + "px";
      a.style.top = p.ay * H - 6 + "px";
      a.style.setProperty("--anchor-c", def.color);
      pins.appendChild(a);
      const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
      const rect = { x: el.offsetLeft, y: el.offsetTop, w: 264, h: el.offsetHeight || 90 };
      const AX = p.ax * W, AY = p.ay * H;
      const fromX = AX < rect.x ? rect.x : AX > rect.x + rect.w ? rect.x + rect.w :
        Math.max(rect.x + 16, Math.min(AX, rect.x + rect.w - 16));
      const fromY = AY < rect.y ? rect.y : AY > rect.y + rect.h ? rect.y + rect.h :
        Math.max(rect.y + 8, Math.min(AY, rect.y + rect.h - 8));
      ln.setAttribute("x1", fromX); ln.setAttribute("y1", fromY);
      ln.setAttribute("x2", AX); ln.setAttribute("y2", AY);
      wires.appendChild(ln);
    });
    document.getElementById("pinFallback").innerHTML =
      '<div class="glass" style="padding:14px 16px;margin-bottom:14px">' +
      (d.needs_me.length ?
        '<b>Needs you:</b> ' + esc(d.needs_me[0].project) + " · " +
        esc(human(d.needs_me[0].status)) + " " + d.needs_me[0].days + "d" :
        "Clear runway. Nothing waits on you.") + "</div>";
    document.querySelectorAll("[data-resume]").forEach((b) =>
      b.addEventListener("click", () => copy(
        'claude "restore context for project ' + b.dataset.resume +
        ' and continue"', b)));
  }

  let lastData = null;
  window.addEventListener("resize", () => { if (lastData) drawPins(lastData, true); });

  async function load() {
    try {
      const h = await (await fetch("/api/health")).json();
      document.getElementById("brainDot").className = "dot " + (h.brain ? "ok" : "bad");
      document.getElementById("brainState").textContent =
        h.brain ? "brain: live on 4880" : "brain: offline";
    } catch (e) {}
    try {
      const d = await (await fetch("/api/today")).json();
      lastData = d; recent = d.recent;
      const stale = d.recent.filter((p) => p.stale).length;
      document.getElementById("dateChip").textContent = d.date;
      document.getElementById("subLine").textContent =
        d.needs_me.length + " thing" + (d.needs_me.length === 1 ? " needs" : "s need") +
        " you · " + d.project_count + " projects in the cabinet";
      document.getElementById("chips").innerHTML =
        chip("chipNeeds", d.needs_me.length, "needs you",
          d.needs_me.length ? "var(--accent)" : "var(--ok)", 0) +
        chip("chipProjects", d.project_count, "projects", "var(--text)", 60) +
        chip("chipQuiet", stale, "quiet 14d+", "var(--mut)", 120) +
        chip("chipCaptures", d.captures || 0, "captures", "var(--ok)", 180);
      renderRecent("");
      drawPins(d);
      const radar = document.getElementById("radarRow");
      if (d.deadlines && d.deadlines.length) {
        radar.style.display = "flex";
        radar.innerHTML = d.deadlines.map((x, i) => {
          const c = x.days_left <= 7 ? "var(--accent)" :
            x.days_left <= 14 ? "var(--warn)" : "var(--mut)";
          const label = x.days_left < 0 ? "yesterday" :
            x.days_left === 0 ? "today" : x.days_left + " days";
          return '<div class="chip" style="animation-delay:' + (240 + i * 60) +
            'ms" title="' + esc(x.date) + '"><span class="n" style="color:' + c +
            ';font-size:16px">' + esc(label) + '</span><span class="l">' +
            esc(x.project) + "</span></div>";
        }).join("");
      }
    } catch (err) {
      document.getElementById("subLine").innerHTML =
        '<span class="err">Could not read the filing cabinet. Is the server running?</span>';
    }
    window.__ready = true;
  }

  const briefBody = document.getElementById("briefBody");
  const briefMeta = document.getElementById("briefMeta");
  const briefRun = document.getElementById("briefRun");
  const briefPlay = document.getElementById("briefPlay");
  let briefText = "", speaking = null, voiceAudio = null, voiceLoading = false;

  async function prefetchVoice() {
    if (voiceLoading || !briefText) return;
    voiceLoading = true; voiceAudio = null;
    briefPlay.disabled = true; briefPlay.textContent = "Voice loading…";
    try {
      const resp = await fetch("/api/speak", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: briefText }) });
      if (!resp.ok) throw new Error("no fish");
      voiceAudio = new Audio(URL.createObjectURL(await resp.blob()));
      voiceAudio.addEventListener("ended", () => {
        speaking = null; briefPlay.textContent = "Play"; });
    } catch (ex) { voiceAudio = null; }
    voiceLoading = false;
    briefPlay.disabled = false; briefPlay.textContent = "Play";
  }

  function showBriefing(d) {
    briefText = d.text;
    briefBody.hidden = false; briefBody.classList.remove("err");
    briefBody.textContent = d.text;
    briefMeta.textContent = "generated " + d.generated + " · " + d.date;
    briefPlay.hidden = false;
    briefRun.textContent = "Refresh";
    prefetchVoice();
  }

  fetch("/api/briefing").then((r) => r.json()).then((d) => {
    if (d.ok) showBriefing(d);
  }).catch(() => {});

  briefRun.addEventListener("click", async () => {
    briefRun.disabled = true;
    briefRun.textContent = "Brock is reading the cabinet…";
    try {
      const resp = await fetch("/api/briefing", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ force: true }) });
      const d = await resp.json();
      if (!d.ok) throw new Error(d.error || "generation failed");
      showBriefing(d);
    } catch (ex) {
      briefBody.hidden = false; briefBody.classList.add("err");
      briefBody.textContent = "Brock could not run: " + ex.message;
      briefRun.textContent = "Run briefing";
    }
    briefRun.disabled = false;
    if (briefText) briefRun.textContent = "Refresh";
  });

  briefPlay.addEventListener("click", () => {
    if (speaking) {
      if (speaking.pause) speaking.pause(); else speechSynthesis.cancel();
      if (speaking.currentTime !== undefined) speaking.currentTime = 0;
      speaking = null; briefPlay.textContent = "Play"; return;
    }
    if (!briefText || voiceLoading) return;
    if (voiceAudio) {
      speaking = voiceAudio;
      briefPlay.textContent = "Stop";
      voiceAudio.play().catch(() => {
        speaking = null; briefPlay.textContent = "Play";
      });
      return;
    }
    const u = new SpeechSynthesisUtterance(briefText);
    u.lang = "en-AU";
    const voices = speechSynthesis.getVoices();
    const voice = voices.find((v) => v.name === "Karen") ||
      voices.find((v) => v.lang === "en-AU");
    if (voice) u.voice = voice;
    u.rate = 1.02; u.pitch = 0.92;
    u.addEventListener("end", () => {
      speaking = null; briefPlay.textContent = "Play"; });
    speaking = { pause: () => speechSynthesis.cancel() };
    briefPlay.textContent = "Stop";
    speechSynthesis.speak(u);
  });

  load();

  const askBtn = document.getElementById("askBrock");
  const chatVeil = document.getElementById("chatVeil");
  const chatOrb = document.getElementById("chatOrb");
  const chatStatus = document.getElementById("chatStatus");
  const chatLog = document.getElementById("chatLog");
  const chatMicBtn = document.getElementById("chatMicBtn");
  let fishVoice = false;
  fetch("/api/health").then((r) => r.json())
    .then((h) => { fishVoice = !!h.fish; }).catch(() => {});

  const chat = { active: false, listening: false, busy: false,
                 rec: null, sr: null, stream: null, audio: null, idleMisses: 0 };

  function setOrb(state, status) {
    chatOrb.className = "orb" + (state ? " " + state : "");
    chatStatus.textContent = status;
  }

  function chatTurn(who, text) {
    const div = document.createElement("div");
    div.className = "turn " + (who === "You" ? "you" : "brock");
    const b = document.createElement("b");
    b.textContent = who + ": ";
    div.appendChild(b);
    div.appendChild(document.createTextNode(text));
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }

  function speakText(text) {
    return new Promise(async (resolve) => {
      try {
        const resp = await fetch("/api/speak", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }) });
        if (!resp.ok) throw new Error("no fish");
        const audio = new Audio(URL.createObjectURL(await resp.blob()));
        chat.audio = audio;
        audio.addEventListener("ended", () => { chat.audio = null; resolve(); });
        audio.addEventListener("error", () => { chat.audio = null; resolve(); });
        audio.play().catch(() => { chat.audio = null; resolve(); });
      } catch (e) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-AU";
        const v = speechSynthesis.getVoices().find((x) => x.name === "Karen");
        if (v) u.voice = v;
        u.addEventListener("end", resolve);
        chat.audio = { pause: () => { speechSynthesis.cancel(); resolve(); } };
        speechSynthesis.speak(u);
      }
    });
  }

  function stopListening(submit) {
    chat.listening = false;
    if (chat.rec && chat.rec.state === "recording") {
      chat.rec.submitOnStop = submit;
      chat.rec.stop();
    }
    if (chat.sr) { try { chat.sr.stop(); } catch (e) {} chat.sr = null; }
  }

  async function converse(question) {
    question = (question || "").trim();
    if (!chat.active) return;
    if (!question) {
      chat.idleMisses += 1;
      if (chat.idleMisses >= 2) {
        setOrb("", "quiet here · tap Speak when ready");
        chatMicBtn.textContent = "Speak";
        return;
      }
      startListening();
      return;
    }
    chat.idleMisses = 0;
    if (/\b(goodbye|good bye|bye brock|end chat|stop chat)\b/i.test(question)) {
      chatTurn("You", question);
      chatTurn("Brock", "Talk soon.");
      setOrb("speak", "Brock speaking…");
      await speakText("Talk soon.");
      closeChat();
      return;
    }
    chatTurn("You", question);
    chat.busy = true;
    setOrb("think", "Brock is thinking…");
    chatMicBtn.textContent = "Speak";
    let answer = "";
    try {
      const resp = await fetch("/api/brock-chat", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }) });
      const d = await resp.json();
      if (!d.ok) throw new Error(d.error || "no answer");
      answer = d.answer;
    } catch (ex) {
      chat.busy = false;
      chatTurn("Brock", "I hit a snag: " + ex.message);
      setOrb("", "error · tap Speak to retry");
      return;
    }
    chat.busy = false;
    if (!chat.active) return;
    chatTurn("Brock", answer);
    setOrb("speak", "Brock speaking…");
    await speakText(answer);
    if (chat.active) startListening();
  }

  async function startListening() {
    if (!chat.active || chat.busy || chat.listening) return;
    chat.listening = true;
    setOrb("listen", "listening…");
    chatMicBtn.textContent = "Done talking";
    if (fishVoice && navigator.mediaDevices) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chat.stream = stream;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        await ctx.resume().catch(() => {});
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        ctx.createMediaStreamSource(stream).connect(analyser);
        const buf = new Uint8Array(analyser.fftSize);
        const chunks = [];
        const rec = new MediaRecorder(stream, { mimeType: "audio/webm" });
        chat.rec = rec;
        rec.addEventListener("dataavailable", (e) => chunks.push(e.data));
        let spoke = false, silentMs = 0, totalMs = 0;
        const poll = setInterval(() => {
          if (rec.state !== "recording") { clearInterval(poll); return; }
          analyser.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = (buf[i] - 128) / 128; sum += v * v;
          }
          const rms = Math.sqrt(sum / buf.length);
          totalMs += 100;
          if (rms > 0.015) { spoke = true; silentMs = 0; }
          else if (spoke) silentMs += 100;
          if ((spoke && silentMs >= 1500) || totalMs >= 20000 ||
              (!spoke && totalMs >= 8000)) {
            rec.submitOnStop = spoke;
            rec.stop();
          }
        }, 100);
        rec.addEventListener("stop", async () => {
          clearInterval(poll);
          stream.getTracks().forEach((t) => t.stop());
          ctx.close().catch(() => {});
          chat.stream = null; chat.rec = null; chat.listening = false;
          if (!chat.active) return;
          if (!rec.submitOnStop) { converse(""); return; }
          setOrb("think", "hearing you…");
          try {
            const resp = await fetch("/api/transcribe", { method: "POST",
              headers: { "Content-Type": "audio/webm" },
              body: new Blob(chunks, { type: "audio/webm" }) });
            const d = await resp.json();
            converse((d.text || "").trim());
          } catch (e) { converse(""); }
        });
        rec.start();
        return;
      } catch (e) { /* mic denied: fall through */ }
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      chat.listening = false;
      setOrb("", "no microphone access · close and type to Capture instead");
      return;
    }
    const sr = new SR();
    chat.sr = sr;
    sr.lang = "en-AU"; sr.continuous = false; sr.interimResults = false;
    let heard = "";
    sr.addEventListener("result", (e) => {
      heard = e.results[0][0].transcript.trim(); });
    sr.addEventListener("end", () => {
      chat.sr = null; chat.listening = false; converse(heard); });
    sr.addEventListener("error", () => {
      chat.sr = null; chat.listening = false; converse(""); });
    sr.start();
  }

  function closeChat() {
    chat.active = false;
    stopListening(false);
    if (chat.audio && chat.audio.pause) chat.audio.pause();
    chat.audio = null;
    chatVeil.classList.remove("on");
  }

  askBtn.addEventListener("click", async () => {
    chatVeil.classList.add("on");
    chat.active = true; chat.idleMisses = 0;
    if (!chatLog.children.length) {
      const hello = "Brock here. What's on your mind?";
      chatTurn("Brock", hello);
      setOrb("speak", "Brock speaking…");
      await speakText(hello);
    }
    if (chat.active) startListening();
  });
  chatMicBtn.addEventListener("click", () => {
    if (chat.listening) stopListening(true);
    else if (!chat.busy) { chat.idleMisses = 0; startListening(); }
  });
  document.getElementById("chatEnd").addEventListener("click", closeChat);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && chat.active) closeChat();
  });
  document.getElementById("chatNew").addEventListener("click", async () => {
    stopListening(false);
    if (chat.audio && chat.audio.pause) chat.audio.pause();
    chatLog.innerHTML = "";
    setOrb("", "fresh start");
    try {
      await fetch("/api/brock-chat", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reset: true }) });
    } catch (e) {}
    const hello = "Clean slate. Where do you want to start?";
    chatTurn("Brock", hello);
    setOrb("speak", "Brock speaking…");
    await speakText(hello);
    if (chat.active) startListening();
  });

  document.getElementById("snapBtn").addEventListener("click", async () => {
    const b = document.getElementById("snapBtn");
    b.disabled = true; b.textContent = "Zipping…";
    try {
      const d = await (await fetch("/api/backup", { method: "POST" })).json();
      if (!d.ok) throw new Error(d.error || "backup failed");
      b.textContent = "Saved ✓";
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = "<b>Snapshot saved.</b> ";
      toast.appendChild(document.createTextNode(
        (d.bytes / 1048576).toFixed(1) + " MB, revealed in Finder."));
      document.body.appendChild(toast);
      setTimeout(() => toast.classList.add("on"), 20);
      setTimeout(() => { toast.classList.remove("on");
        setTimeout(() => toast.remove(), 400); }, 4500);
    } catch (ex) { b.textContent = "Failed, retry"; }
    setTimeout(() => { b.disabled = false;
      b.textContent = "Snapshot backup"; }, 2500);
  });

  let captureCount = null;
  function countUp(el, target) {
    const t0 = performance.now(), dur = 600;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 3))))
        .padStart(2, "0");
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { el.textContent = String(target).padStart(2, "0"); },
      dur + 150);
  }
  try {
    const ev = new EventSource("/api/events");
    ev.onmessage = (m) => {
      let d; try { d = JSON.parse(m.data); } catch (e) { return; }
      if (d.type !== "added" || !d.node) return;
      const tile = document.getElementById("chipCaptures");
      if (tile) {
        const n = tile.querySelector(".n");
        if (captureCount === null) captureCount = Number(n.dataset.n);
        captureCount += 1; n.dataset.n = captureCount;
        countUp(n, captureCount);
        tile.classList.remove("pulse"); void tile.offsetWidth;
        tile.classList.add("pulse");
      }
      const cap = document.getElementById("capVal");
      if (cap) cap.textContent =
        String(Number(cap.textContent) + 1).padStart(2, "0");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = "<b>Node born.</b> ";
      toast.appendChild(document.createTextNode(
        (d.node.label || "new memory") + " just joined the Brain."));
      document.body.appendChild(toast);
      setTimeout(() => toast.classList.add("on"), 20);
      setTimeout(() => { toast.classList.remove("on");
        setTimeout(() => toast.remove(), 400); }, 4200);
    };
  } catch (e) {}
</script>

  var g=document.getElementById("ownerName"); if(g) g.textContent=o.name;
