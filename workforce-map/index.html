<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain</title>
<style>
  :root {
    --bg: #FAF8F2;
    --panel: rgba(255, 255, 255, 0.94);
    --line: rgba(20, 24, 28, 0.1);
    --text: #16181A;
    --dim: #7A8087;
    --accent: #9CCF1E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  #brand { top: 20px; left: 24px; }
  #brand h1 {
    font-size: 15px; letter-spacing: 0.35em; font-weight: 700;
    color: var(--text); text-transform: uppercase;
  }
  #brand .sub {
    font-size: 10px; color: var(--dim); letter-spacing: 0.12em; margin-top: 5px;
  }
  #brand .sub b { color: var(--accent); font-weight: 600; }

  #lensChip {
    margin-top: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 6px 14px; font-size: 10.5px; letter-spacing: 0.1em;
    color: var(--text); cursor: pointer; user-select: none; display: inline-flex;
    align-items: center; gap: 8px; backdrop-filter: blur(12px); transition: all 0.15s ease;
  }
  #lensChip:hover { border-color: var(--accent); }
  #lensChip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #lensChip .lock { font-size: 9px; opacity: 0.6; }
  .pchip {
    background: transparent; border: 1px solid var(--line); border-radius: 20px;
    padding: 7px 14px; font-size: 10.5px; letter-spacing: 0.1em; color: var(--dim);
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px;
    transition: all 0.15s ease; margin-bottom: 6px;
  }
  .pchip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pchip.active { color: var(--text); border-color: var(--accent); font-weight: 600; }
  .pchip.active .dot { background: var(--accent); }
  .pchip .lock { font-size: 9px; opacity: 0.6; }

  #searchWrap { top: 20px; left: 50%; transform: translateX(-50%); position: fixed; }
  #search {
    width: 400px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 42px 9px 14px; color: var(--text);
    font-family: inherit; font-size: 12px; outline: none;
    backdrop-filter: blur(12px);
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--dim); }
  #micBtn {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: transparent; color: var(--dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #micBtn:hover { color: var(--text); }
  #micBtn.listening { color: #E5484D; animation: pulse 1.2s ease infinite; }
  #micBtn.speaking { color: var(--accent); animation: pulse 1.6s ease infinite; }
  #micBtn svg { width: 16px; height: 16px; fill: currentColor; }

  #menuBtn {
    top: 20px; right: 24px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--dim); font-family: inherit; font-size: 10px; letter-spacing: 0.14em;
    padding: 9px 16px; cursor: pointer; text-transform: uppercase;
    backdrop-filter: blur(12px); transition: all 0.15s ease;
  }
  #menuBtn:hover { color: var(--text); border-color: var(--accent); }

  #drawer {
    top: 0; right: 0; width: 280px; height: 100%; z-index: 20;
    background: var(--panel); border-left: 1px solid var(--line);
    backdrop-filter: blur(16px); padding: 26px 22px;
    transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
    overflow-y: auto;
  }
  #drawer.open { transform: translateX(0); }
  #drawer .sec { margin-bottom: 26px; }
  #drawer .sec .lbl {
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 10px;
  }
  #drawer #closeDrawer {
    position: absolute; top: 16px; right: 18px; background: none; border: none;
    color: var(--dim); font-size: 18px; cursor: pointer; font-family: inherit;
  }
  #drawer #closeDrawer:hover { color: var(--text); }
  #drawer .legendTxt { font-size: 10px; color: var(--dim); line-height: 2; letter-spacing: 0.08em; }

  #layoutToggle {
    display: flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  #layoutToggle button {
    flex: 1; background: transparent; border: none; color: var(--dim); font-family: inherit;
    font-size: 10px; letter-spacing: 0.12em; padding: 8px 14px; cursor: pointer;
    text-transform: uppercase;
  }
  #layoutToggle button.active { color: var(--text); font-weight: 700; background: rgba(127,127,127,0.1); }

  #filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: transparent; border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 12px; font-size: 10px; letter-spacing: 0.08em; color: var(--dim);
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
    transition: all 0.15s ease;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.on { color: var(--text); border-color: rgba(127,127,127,0.35); }
  .chip.off { opacity: 0.35; }

  #howto {
    bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: 760px;
  }
  #howto .ht { font-size: 9px; letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; margin-right: 4px; }
  .qchip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 7px 14px; font-size: 11px; color: var(--dim); cursor: pointer;
    backdrop-filter: blur(12px); transition: all 0.15s ease; user-select: none;
  }
  .qchip:hover { color: var(--text); border-color: var(--accent); }

  #panel {
    top: 0; right: 0; width: 340px; height: 100%;
    background: var(--panel); border-left: 1px solid var(--line);
    backdrop-filter: blur(16px); padding: 28px 24px;
    transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
    overflow-y: auto;
  }
  #panel.open { transform: translateX(0); }
  #panel .kind {
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 4px; display: inline-block;
    border: 1px solid var(--line); color: var(--dim); margin-bottom: 14px;
  }
  #panel h2 { font-size: 17px; line-height: 1.35; margin-bottom: 12px; font-weight: 600; }
  #panel .desc { font-size: 12px; line-height: 1.7; color: var(--dim); margin-bottom: 20px; white-space: pre-wrap; }
  #panel .row { margin-bottom: 14px; }
  #panel .row .lbl {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 5px;
  }
  #panel .row .val {
    font-size: 11px; line-height: 1.6; word-break: break-all; color: var(--text);
  }
  #panel .row .val a { color: var(--accent); text-decoration: none; filter: brightness(0.75); }
  #panel .row .val a:hover { text-decoration: underline; }
  #panel .val.path { cursor: pointer; }
  #panel .val.path:hover { color: var(--accent); }
  #panel #closePanel {
    position: absolute; top: 18px; right: 18px; background: none; border: none;
    color: var(--dim); font-size: 18px; cursor: pointer; font-family: inherit;
  }
  #panel #closePanel:hover { color: var(--text); }
  #panel .neigh {
    font-size: 11px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: 6px; cursor: pointer; display: flex;
    align-items: center; gap: 8px; color: var(--dim); transition: all 0.12s;
  }
  #panel .neigh:hover { border-color: rgba(127,127,127,0.4); color: var(--text); }
  #panel .neigh .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

  #replayBar {
    bottom: 22px; right: 24px;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 14px; backdrop-filter: blur(12px);
  }
  #replayBar button {
    background: none; border: none; color: var(--dim); font-family: inherit;
    font-size: 10.5px; cursor: pointer; letter-spacing: 0.12em; text-transform: uppercase;
  }
  #replayBar button:hover { color: var(--text); }
  #timeline { width: 130px; accent-color: var(--accent); cursor: pointer; display: none; }
  #replayCaption { font-size: 9.5px; color: var(--dim); letter-spacing: 0.08em; display: none; }
  #replayBar.live #timeline, #replayBar.live #replayCaption { display: inline-block; }

  #scanline {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; letter-spacing: 0.25em; color: var(--dim);
    transition: opacity 0.7s ease; pointer-events: none;
  }
  #scanline.gone { opacity: 0; }

  #toasts {
    position: fixed; bottom: 158px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--panel); border: 1px solid rgba(212, 160, 23, 0.55);
    border-radius: 8px; padding: 9px 18px; font-size: 11px; letter-spacing: 0.06em;
    color: var(--text); backdrop-filter: blur(12px);
    animation: toastIn 0.35s cubic-bezier(0.2, 0, 0, 1);
  }
  .toast b { color: #B8860B; font-weight: 600; }
  .toast.fade { opacity: 0; transition: opacity 0.6s ease; }
  @keyframes toastIn { from { transform: translateY(14px); opacity: 0; } }

  #thinking {
    top: 100px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.2em; color: var(--text);
    text-transform: uppercase; display: none;
  }
  #thinking.on { display: block; animation: pulse 1.4s ease infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #panel .answer { font-size: 12px; line-height: 1.75; color: var(--text); margin-bottom: 20px; white-space: pre-wrap; }
  #panel .cite {
    display: inline-flex; align-items: center; gap: 7px; margin: 0 6px 6px 0;
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 16px;
    font-size: 10.5px; color: var(--dim); cursor: pointer; transition: all 0.12s;
  }
  #panel .cite:hover { border-color: rgba(127,127,127,0.45); color: var(--text); }
  #panel .cite .dot { width: 6px; height: 6px; border-radius: 50%; }
</style>
</head>

  <div class="sec">

</div>

<div class="hud" id="replayBar" style="display:none">

</div>

<div class="hud" id="howto"></div>

<div id="toasts"></div>

</div>

function computeWheel() {

    else byHub.get(act[0].id).push(n);

  // order each hub's items: packs first, each pack immediately followed by its children

    const direct = byHub.get(h.id) || [];
    direct.sort((a, b) => (kindRank[a.kind] ?? 4) - (kindRank[b.kind] ?? 4) || a.label.localeCompare(b.label));
    const seq = [];
    for (const n of direct) {
      seq.push(n);
      if (n.kind === "pack" && byPack[n.id]) {
        byPack[n.id].sort((a, b) => a.label.localeCompare(b.label));
        seq.push(...byPack[n.id]);
      }

    3 + Math.pow(hubItems.get(h.id).length, 0.72) * (expandedGroups.has(h.group) ? 6 : 1));

  let theta = -Math.PI / 2;

  act.forEach((h, i) => {

    const mid = theta + sector / 2;

// force simulation (galaxy mode)
let alpha = 1;
function tick() {
  const vis = nodes.filter(n => n.visible && n.spawned);
  for (let i = 0; i < vis.length; i++) {
    const a = vis[i];
    for (let j = i + 1; j < vis.length; j++) {
      const b = vis[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      const bothHub = (a.kind === "hub" || a.kind === "brain") && (b.kind === "hub" || b.kind === "brain");
      if (d2 > (bothHub ? 1600000 : 160000)) continue;
      const f = (bothHub ? 26000 : a.kind === "hub" || b.kind === "hub" ? 2600 : 900) / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  for (const e of edges) {
    if (!e.s.visible || !e.t.visible || !e.s.spawned || !e.t.spawned) continue;
    const rest = e.s.kind === "brain" || e.t.kind === "brain" ? 560
               : e.s.kind === "hub" && e.t.kind === "hub" ? 620
               : e.s.kind === "hub" || e.t.kind === "hub" ? 130 : 100;
    let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - rest) * 0.012;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
  }
  for (const n of vis) {
    n.vx += -n.x * 0.0009; n.vy += -n.y * 0.0009;
    n.vx *= 0.82; n.vy *= 0.82;
    if (n.kind !== "brain") { n.x += n.vx * alpha; n.y += n.vy * alpha; }
  }
  if (alpha > 0.06) alpha *= 0.996;
}

// interaction state
let hover = null, selected = null, searchTerm = "", askSet = null;
let expandedGroups = new Set();
const kindOn = { memory: true, skill: true, pack: true, project: true, hub: true, brain: true };
const groupOn = {};
[...new Set(nodes.map(n => n.group))].forEach(g => groupOn[g] = true);

function matches(n) {
  if (!searchTerm) return true;
  return (n.label + " " + n.description + " " + n.id).toLowerCase().includes(searchTerm);
}
function applyFilters() {
  nodes.forEach(n => {
    n.visible = n.profileOn && (kindOn[n.kind] !== false) && (groupOn[n.group] !== false)
      && (n.kind !== "skill" || expandedGroups.has(n.group) || (!!searchTerm && matches(n)));
  });
  if (brainNode) brainNode.visible = true;
  alpha = Math.max(alpha, 0.35);
  layoutDirty = true;
}
function toggleGroup(hub) {
  const g = hub.group;
  const open = expandedGroups.has(g);
  expandedGroups = new Set(open ? [] : [g]);
  if (!open) for (const m of nodes) {
    if (m.kind === "skill" && m.group === g) { m.x = hub.x; m.y = hub.y; m.bornPulse = performance.now(); }
  }
  applyFilters();
  if (open) { if (brainNode) flyTo(brainNode, homeK); }
  else flyTo(hub, Math.max(cam.k, 0.95));
}
function neighborSet(n) {
  const s = new Set([n.id]);
  adj[n.id].forEach(m => s.add(m.id));
  return s;
}

// ---- profiles UI ----
function profileGroups(p) {

function draw() {
  const now = performance.now();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = THEME.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.k, cam.k);
  ctx.translate(-cam.x, -cam.y);

  const focus = hover || selected;
  const hi = askSet || (focus ? neighborSet(focus) : null);
  const searching = searchTerm.length > 0;

  // wheel guide rings
  if (layoutMode === "wheel" && wheelRings.length) {
    ctx.strokeStyle = "rgba(" + THEME.inkRGB + ",0.05)";
    ctx.lineWidth = 1 / cam.k;
    for (const R of wheelRings) {
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  for (const e of edges) {
    if (!e.s.visible || !e.t.visible || !e.s.spawned || !e.t.spawned || !e.bornAt) continue;
    const p = Math.min(1, (now - e.bornAt) / 400);
    let a = THEME.light ? 0.07 : 0.05;
    if (hi) a = (hi.has(e.s.id) && hi.has(e.t.id)) ? 0.4 : 0.02;
    ctx.strokeStyle = "rgba(" + THEME.inkRGB + "," + a + ")";
    ctx.lineWidth = 1 / cam.k;
    ctx.beginPath();
    ctx.moveTo(e.s.x, e.s.y);
    ctx.lineTo(e.s.x + (e.t.x - e.s.x) * p, e.s.y + (e.t.y - e.s.y) * p);
    ctx.stroke();
  }

  let spawnedCount = 0;
  for (const n of nodes) {
    if (n.spawned && n.visible) spawnedCount++;
    if (!n.visible || !n.spawned) continue;
    const col = n.kind === "brain" ? (THEME.light ? "#16181A" : "#FFFFFF") : colorOf(n);
    let dim = false;
    if (hi && !hi.has(n.id)) dim = true;
    if (searching && !matches(n)) dim = true;
    ctx.globalAlpha = dim ? 0.1 : 1;

    if ((n.url || n.kind === "hub" || n.kind === "brain") && !dim) {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 3.2);
      g.addColorStop(0, col + (THEME.light ? "2E" : "55"));
      g.addColorStop(1, col + "00");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    if (n.bornPulse) {
      const age = now - n.bornPulse;
      if (age < 900) {
        ctx.save();
        if (!THEME.light) ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = (1 - age / 900) * 0.8;
        ctx.strokeStyle = n.pulseColor || col;
        ctx.lineWidth = 2 / cam.k;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + (age / 900) * 46, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = dim ? 0.1 : 1;
      } else if (!n.repulse) { n.bornPulse = 0; }
      if (n.repulse && age >= 700) n.bornPulse = now;
    }

    ctx.fillStyle = col;
    ctx.beginPath();
    if (n.kind === "memory") {
      ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(Math.PI / 4);
      ctx.rect(-n.r * 0.8, -n.r * 0.8, n.r * 1.6, n.r * 1.6);
      ctx.restore();
    } else if (n.kind === "pack") {
      for (let i = 0; i < 6; i++) {
        const a2 = Math.PI / 3 * i - Math.PI / 6;
        const px = n.x + Math.cos(a2) * n.r, py = n.y + Math.sin(a2) * n.r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    }
    ctx.fill();
    if (THEME.light && !dim) {
      ctx.strokeStyle = "rgba(" + THEME.inkRGB + ",0.22)";
      ctx.lineWidth = 0.75 / cam.k;
      ctx.stroke();
    }

    if (n.url) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.2 / cam.k;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 3.5 / cam.k, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (n === selected) {
      ctx.strokeStyle = THEME.light ? "#16181A" : "#FFFFFF";
      ctx.lineWidth = 1.5 / cam.k;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 6 / cam.k, 0, Math.PI * 2);
      ctx.stroke();
    }

    const showLabel = n.kind === "brain" || n.kind === "hub" || n.kind === "pack"
      || (n.kind === "skill" && expandedGroups.has(n.group))
      || cam.k > 1.15 || n === hover || n === selected
      || (hi && hi.has(n.id) && cam.k > 0.7)
      || (searching && matches(n) && !dim);
    if (showLabel && !dim) {
      const fs = (n.kind === "brain" ? 15 : n.kind === "hub" ? 11.5 : 9.5) / Math.max(cam.k, 0.62);
      ctx.font = (n.kind === "hub" || n.kind === "brain" ? "700 " : "400 ") + fs + "px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = n.kind === "hub" || n.kind === "brain"
        ? (THEME.light ? "#16181A" : "#FFFFFF")
        : "rgba(" + THEME.inkRGB + ",0.8)";
      ctx.textAlign = "center";
      const txt = n.kind === "hub" || n.kind === "brain" ? n.label.toUpperCase() : n.label;
      if (n.kind === "skill" && expandedGroups.has(n.group) && txt.length > 14 && txt.includes(" ")) {
        const mid = Math.floor(txt.length / 2);
        let cut = -1;
        for (let i = 0; i < txt.length; i++) {
          if (txt[i] === " " && (cut < 0 || Math.abs(i - mid) < Math.abs(cut - mid))) cut = i;
        }
        ctx.fillText(txt.slice(0, cut), n.x, n.y + n.r + fs + 4 / cam.k);
        ctx.fillText(txt.slice(cut + 1), n.x, n.y + n.r + fs * 2.15 + 4 / cam.k);
      } else {
        ctx.fillText(txt, n.x, n.y + n.r + fs + 4 / cam.k);
      }
      if (n.kind === "hub" || n.kind === "brain") {
        ctx.font = "400 " + fs * 0.62 + "px 'JetBrains Mono', monospace";
        ctx.fillStyle = "rgba(" + THEME.inkRGB + ",0.55)";
        ctx.fillText(n.description, n.x, n.y + n.r + fs * 1.85 + 4 / cam.k);
      }
    }
    ctx.globalAlpha = 1;
  }

  if (spawnedCount !== lastCount) { nCountEl.textContent = spawnedCount; lastCount = spawnedCount; }
}

let frame = 0;
function loop() {
  const now = performance.now();
  frame++;
  if (anim.mode === "intro") {
    const el = now - anim.t0;
    while (anim.qi < anim.queue.length && anim.queue[anim.qi].t <= el) {
      spawnNode(anim.queue[anim.qi].n); anim.qi++;
    }
    const p = easeIO(Math.min(1, el / anim.dur));
    cam.k = 2.2 + (homeK - 2.2) * p;
    cam.x = 0; cam.y = 0;
    alpha = Math.max(alpha, 0.5);
    if (el >= anim.dur) { anim.mode = "idle"; clearInterval(dotsTimer); }
  } else if (anim.mode === "replay") {
    const el = now - anim.t0;
    const f = Math.min(1, el / 15000);
    setCutoff(tmin + f * (tmax - tmin));
    timelineEl.value = Math.round(f * 1000);
    if (f >= 1) anim.mode = "idle";
  }
  if (layoutMode === "wheel") {
    if (layoutDirty && frame % 4 === 0) { computeWheel(); layoutDirty = false; }
    for (const n of nodes) {
      if (!n.spawned || !n.visible) continue;
      n.x += (n.tx - n.x) * 0.14;
      n.y += (n.ty - n.y) * 0.14;
    }
  } else {
    tick();
  }
  draw();
  requestAnimationFrame(loop);
}

}

// hit test
function nodeAt(px, py) {
  const w = toWorld(px, py);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (!n.visible || !n.spawned) continue;
    const dx = n.x - w.x, dy = n.y - w.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    const hitR = n.r + 8 / cam.k;
    if (d < hitR && d < bd) { best = n; bd = d; }
  }
  return best;
}

// pan / zoom / hover / click
let dragging = false, moved = false, lx = 0, ly = 0;
canvas.addEventListener("mousedown", e => { dragging = true; moved = false; lx = e.clientX; ly = e.clientY; canvas.classList.add("dragging"); });
window.addEventListener("mouseup", () => { dragging = false; canvas.classList.remove("dragging"); });
window.addEventListener("mousemove", e => {
  if (dragging) {
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (anim.mode === "intro") finishIntro();
    cam.x -= dx / cam.k; cam.y -= dy / cam.k;
    lx = e.clientX; ly = e.clientY;
  } else {
    hover = nodeAt(e.clientX, e.clientY);
    canvas.style.cursor = hover ? "pointer" : "grab";
  }
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (anim.mode === "intro") finishIntro();
  const w = toWorld(e.clientX, e.clientY);
  const k2 = Math.min(4, Math.max(0.15, cam.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  cam.x = w.x - (e.clientX - W / 2) / k2;
  cam.y = w.y - (e.clientY - H / 2) / k2;
  cam.k = k2;
}, { passive: false });
canvas.addEventListener("click", e => {
  if (anim.mode === "intro") { finishIntro(); return; }
  if (moved) return;
  askSet = null;
  const n = nodeAt(e.clientX, e.clientY);
  if (n && n.kind === "hub") toggleGroup(n);
  if (n) selectNode(n); else { selected = null; panel.classList.remove("open"); }
});
window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    askSet = null; selected = null; panel.classList.remove("open");
    if (expandedGroups.size) { expandedGroups = new Set(); applyFilters(); }
    document.getElementById("drawer").classList.remove("open");
    stopSpeech();
    if (brainNode) brainNode.repulse = false;
  }
});

// panel

document.getElementById("closePanel").onclick = () => { selected = null; askSet = null; panel.classList.remove("open"); };

function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function selectNode(n) {
  selected = n;
  try { if (window.parent !== window) window.parent.postMessage({ owneros_role: n.id }, "*"); } catch (e) {}
  const col = colorOf(n);
  let html = '<div class="kind" style="border-color:' + col + '88; color:' + (THEME.light ? "#16181A" : col) + '">' + esc(n.kind) + ' &middot; ' + esc(n.group) + '</div>';
  html += "<h2>" + esc(n.label) + "</h2>";
  html += '<div class="desc">' + esc(n.description) + "</div>";
  if (n.url) html += '<div class="row"><div class="lbl">Live</div><div class="val"><a href="' + esc(n.url) + '" target="_blank">' + esc(n.url) + "</a></div></div>";
  if (n.path && !profile.hidePaths) html += '<div class="row"><div class="lbl">Path (click to copy)</div><div class="val path" data-p="' + esc(n.path) + '">' + esc(n.path) + "</div></div>";
  if (n.born) {
    const d = new Date(n.born * 1000);
    html += '<div class="row"><div class="lbl">Born</div><div class="val">' + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() + "</div></div>";
  }
  const ns = adj[n.id].filter(m => m.visible);
  if (ns.length) {
    html += '<div class="row"><div class="lbl">Connected (' + ns.length + ")</div>";
    const sorted = [...ns].sort((a, b) => b.deg - a.deg).slice(0, 30);
    for (const m of sorted) {
      html += '<div class="neigh" data-id="' + esc(m.id) + '"><span class="dot" style="background:' + colorOf(m) + '"></span>' + esc(m.label) + "</div>";
    }
    if (ns.length > 30) html += '<div style="font-size:10px;color:var(--dim);margin-top:4px">+ ' + (ns.length - 30) + " more</div>";
    html += "</div>";
  }
  panelBody.innerHTML = html;
  panel.classList.add("open");
  wirePanel();
}
function wirePanel() {
  panelBody.querySelectorAll(".neigh").forEach(el => {
    el.onclick = () => { const m = byId[el.dataset.id]; if (m) { selectNode(m); flyTo(m); } };
  });
  panelBody.querySelectorAll(".path").forEach(el => {
    el.onclick = () => { navigator.clipboard.writeText(el.dataset.p); el.textContent = "copied"; setTimeout(() => el.textContent = el.dataset.p, 900); };
  });
  panelBody.querySelectorAll(".cite").forEach(el => {
    el.onclick = () => { const m = byId[el.dataset.id]; if (m) { flyTo(m); m.bornPulse = performance.now(); } };
  });
}
function flyTo(n, tk) {
  const sx = cam.x, sy = cam.y, sk = cam.k;
  tk = tk || Math.max(cam.k, 1.1);
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / 450), e2 = 1 - Math.pow(1 - p, 3);
    cam.x = sx + (n.x - sx) * e2; cam.y = sy + (n.y - sy) * e2; cam.k = sk + (tk - sk) * e2;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---- ask the brain ----
let backend = false;
const thinkingEl = document.getElementById("thinking");
const searchEl = document.getElementById("search");
let serverVoice = false;
fetch("/health").then(r => r.ok ? r.json() : null).then(j => { if (j && j.ok) {
  backend = true;
  serverVoice = j.voice === "eleven";
  searchEl.placeholder = "search the brain... Enter or the mic asks it a question";
  connectEvents();
}}).catch(() => {});

let asking = false;
async function ask(q) {
  if (asking) return;
  asking = true;
  stopSpeech();
  thinkingEl.textContent = "your brain is thinking";
  searchTerm = "";
  applyFilters();
  askSet = new Set([brainNode ? brainNode.id : ""]);
  if (brainNode) { brainNode.repulse = true; brainNode.bornPulse = performance.now(); }
  thinkingEl.classList.add("on");
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const data = await r.json();
    if (brainNode) brainNode.repulse = false;
    thinkingEl.classList.remove("on");
    const cited = (data.cited || []).filter(id => byId[id] && byId[id].visible);
    askSet = new Set(cited);
    if (brainNode) askSet.add(brainNode.id);
    showAnswer(q, data.answer || "No answer.", cited);
    flyCitations(cited);
    speak(data.answer || "");
  } catch (err) {
    if (brainNode) brainNode.repulse = false;
    thinkingEl.classList.remove("on");
    askSet = null;
    toast("Brain server not reachable. Start serve_brain.py.");
  }
  asking = false;
}
function showAnswer(q, answer, cited) {
  selected = null;
  let html = '<div class="kind">ask · the brain answered</div>';
  html += "<h2>" + esc(q) + "</h2>";
  html += '<div class="answer">' + esc(answer) + "</div>";
  if (cited.length) {
    html += '<div class="row"><div class="lbl">It looked at (' + cited.length + ")</div>";
    for (const id of cited) {
      const m = byId[id];
      html += '<span class="cite" data-id="' + esc(id) + '"><span class="dot" style="background:' + colorOf(m) + '"></span>' + esc(m.label) + "</span>";
    }
    html += "</div>";
  }
  panelBody.innerHTML = html;
  panel.classList.add("open");
  wirePanel();
}
function flyCitations(ids) {
  let i = 0;
  function next() {
    if (i >= ids.length) return;
    const n = byId[ids[i]];
    if (n) { flyTo(n, Math.max(cam.k, 0.95)); n.bornPulse = performance.now(); }
    i++;
    setTimeout(next, 1500);
  }
  next();
}
searchEl.addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
});
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && backend && searchEl.value.trim()) {
    ask(searchEl.value.trim());
  }
});

// ---- live growth over SSE ----
const toastsEl = document.getElementById("toasts");
function toast(html) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = html;
  toastsEl.appendChild(t);
  setTimeout(() => t.classList.add("fade"), 3600);
  setTimeout(() => t.remove(), 4300);
}
function addLiveNode(nd) {
  if (byId[nd.id]) return;
  const hub = hubByGroup[nd.group] || byId["hub-other"] || brainNode;
  const n = Object.assign({ vx: 0, vy: 0, visible: true, spawned: false, deg: 0, links: [] }, nd);
  const a = Math.random() * Math.PI * 2;
  n.x = hub.x + Math.cos(a) * 30; n.y = hub.y + Math.sin(a) * 30;
  n.tx = n.x; n.ty = n.y;
  n.anchor = hub;
  const allow = profileGroups(profile);
  n.profileOn = !allow || allow.has(n.group);
  nodes.push(n); byId[n.id] = n; adj[n.id] = [];
  const e = { source: n.id, target: hub.id, s: n, t: hub, bornAt: 0 };
  edges.push(e);
  adj[n.id].push(hub); adj[hub.id].push(n);
  n.deg = 1; hub.deg++;
  sizeNode(n); sizeNode(hub);
  if (groupOn[n.group] === undefined) groupOn[n.group] = true;
  n.visible = n.profileOn && (kindOn[n.kind] !== false) && (groupOn[n.group] !== false);
  spawnNode(n, { gold: true });
  eCountEl.textContent = edges.length;
  toast("New " + esc(n.kind) + ": <b>" + esc(n.label) + "</b>");
}
function connectEvents() {
  const es = new EventSource("/events");
  es.onmessage = m => {
    let ev;
    try { ev = JSON.parse(m.data); } catch (err) { return; }
    if (ev.type === "added" && ev.node) addLiveNode(ev.node);
    else if (ev.type === "changed" && ev.node && byId[ev.node.id]) {
      byId[ev.node.id].description = ev.node.description || byId[ev.node.id].description;
      if (selected && selected.id === ev.node.id) selectNode(selected);
    } else if (ev.type === "removed" && ev.id && byId[ev.id]) {
      const n = byId[ev.id];
      nodes.splice(nodes.indexOf(n), 1);
      edges = edges.filter(e2 => e2.s !== n && e2.t !== n);
      adj[n.id].forEach(m2 => { adj[m2.id] = adj[m2.id].filter(x => x !== n); m2.deg--; });
      delete byId[ev.id]; delete adj[ev.id];
      if (selected === n) { selected = null; panel.classList.remove("open"); }
      eCountEl.textContent = edges.length;
      layoutDirty = true;
    }
  };
}

  const c = document.createElement("div");
  c.className = "chip on";
  c.innerHTML = '<span class="dot" style="background:var(--dim)"></span>' + kindLabels[k];
  c.onclick = () => { kindOn[k] = !kindOn[k]; c.classList.toggle("off", !kindOn[k]); applyFilters(); };
  filtersEl.appendChild(c);
});
let groupChipEls = [];
function buildGroupChips() {
  groupChipEls.forEach(el => el.remove());
  groupChipEls = [];
  const allow = profileGroups(profile);
  const order = (BRAND.groupOrder || Object.keys(groupOn)).filter(g =>
    g in groupOn && g !== "brain" && (!allow || allow.has(g)));
  order.forEach(g => {
    const c = document.createElement("div");
    c.className = "chip " + (groupOn[g] ? "on" : "off");
    c.innerHTML = '<span class="dot" style="background:' + (COLORS[g] || COLORS.other) + '"></span>' + g;
    c.onclick = () => { groupOn[g] = !groupOn[g]; c.classList.toggle("off", !groupOn[g]); applyFilters(); };
    filtersEl.appendChild(c);
    groupChipEls.push(c);
  });
}

// ---- jarvis: voice in, voice out ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("micBtn");
let voiceOn = localStorage.getItem("sb_voice") !== "off";
let listening = false, speaking = false, currentAudio = null;
let rec = null;

if (SR) {
  rec = new SR();
  rec.lang = BRAND.voiceLang || navigator.language || "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onresult = ev => {
    let final = "", interim = "";
    for (const r of ev.results) { if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript; }
    searchEl.value = (final || interim).trim();
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    thinkingEl.classList.remove("on");
    const q = searchEl.value.trim();
    if (q && backend) ask(q);
  };
  rec.onerror = () => { listening = false; micBtn.classList.remove("listening"); thinkingEl.classList.remove("on"); };
}

function stopSpeech() {
  speaking = false;
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  micBtn.classList.remove("speaking");
  thinkingEl.classList.remove("on");
  if (brainNode && !asking) brainNode.repulse = false;
}

function pickVoice() {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  const prefs = ["Karen", "Samantha", "Daniel", "Google UK English Female", "Google US English"];
  for (const p of prefs) { const v = voices.find(v2 => v2.name.includes(p)); if (v) return v; }
  const lang = BRAND.voiceLang || navigator.language || "en-US";
  return voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.startsWith("en")) || voices[0] || null;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => pickVoice();

function browserSpeak(text, done) {
  if (!window.speechSynthesis) { done(); return; }
  const parts = text.match(/[^.!?]+[.!?]+\s*|[^.!?]+$/g) || [text];
  const merged = [];
  let cur = "";
  for (const p of parts) {
    if ((cur + p).length > 220) { if (cur) merged.push(cur); cur = p; }
    else cur += p;
  }
  if (cur) merged.push(cur);
  const v = pickVoice();
  let i = 0;
  const next = () => {
    if (!speaking || i >= merged.length) { done(); return; }
    const u = new SpeechSynthesisUtterance(merged[i++]);
    if (v) u.voice = v;
    u.rate = 1.03;
    u.onend = next;
    u.onerror = () => done();
    speechSynthesis.speak(u);
  };
  next();
}

function speak(text) {
  if (!voiceOn || !text) return;
  stopSpeech();
  speaking = true;
  micBtn.classList.add("speaking");
  thinkingEl.textContent = "speaking · click the mic to stop";
  thinkingEl.classList.add("on");
  if (brainNode) { brainNode.repulse = true; brainNode.bornPulse = performance.now(); }
  const done = () => {
    speaking = false;
    micBtn.classList.remove("speaking");
    thinkingEl.classList.remove("on");
    if (brainNode) brainNode.repulse = false;
  };
  if (serverVoice) {
    fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    }).then(r => { if (!r.ok) throw new Error("tts"); return r.blob(); })
      .then(b => {
        if (!speaking) return;
        currentAudio = new Audio(URL.createObjectURL(b));
        currentAudio.onended = done;
        currentAudio.onerror = done;
        currentAudio.play();
      })
      .catch(() => browserSpeak(text, done));
  } else {
    browserSpeak(text, done);
  }
}

micBtn.onclick = () => {
  if (speaking) { stopSpeech(); return; }
  if (!rec) { toast("Voice input needs Chrome."); return; }
  if (listening) { rec.stop(); return; }
  stopSpeech();
  searchEl.value = "";
  searchTerm = "";
  applyFilters();
  listening = true;
  micBtn.classList.add("listening");
  thinkingEl.textContent = "listening";
  thinkingEl.classList.add("on");
  try { rec.start(); } catch (e) { listening = false; micBtn.classList.remove("listening"); thinkingEl.classList.remove("on"); }
};

// voice toggle in drawer
const voiceWrap = document.getElementById("voiceWrap");
const vChip = document.createElement("div");
vChip.className = "chip " + (voiceOn ? "on" : "off");
vChip.innerHTML = '<span class="dot" style="background:var(--accent)"></span>spoken replies';
vChip.onclick = () => {
  voiceOn = !voiceOn;
  localStorage.setItem("sb_voice", voiceOn ? "on" : "off");
  vChip.classList.toggle("off", !voiceOn);
  vChip.classList.toggle("on", voiceOn);
  if (!voiceOn) stopSpeech();
};
voiceWrap.appendChild(vChip);

// drawer
const drawer = document.getElementById("drawer");
function openDrawer() { drawer.classList.add("open"); panel.classList.remove("open"); }
document.getElementById("menuBtn").onclick = openDrawer;
document.getElementById("lensChip").onclick = openDrawer;
document.getElementById("closeDrawer").onclick = () => drawer.classList.remove("open");
canvas.addEventListener("mousedown", () => drawer.classList.remove("open"));

// how-to: example questions
const howtoEl = document.getElementById("howto");
function buildHowto() {
  const examples = (BRAND.examples && BRAND.examples.length) ? BRAND.examples
    : hubs.slice(0, 2).map(h => "What do I know about " + h.label + "?").concat(["What is live on the web?"]);
  howtoEl.innerHTML = '<span class="ht">try searching</span>';
  examples.slice(0, 3).forEach(q => {
    const c = document.createElement("div");
    c.className = "qchip";
    c.textContent = q;
    c.onclick = () => {
      searchEl.value = q;
      if (backend) { ask(q); }
      else { searchTerm = q.toLowerCase(); }
    };
    howtoEl.appendChild(c);
  });
}
buildHowto();

// boot (after everything above is defined)
setProfile(profile, true);
{
  const g = new URLSearchParams(location.search).get("expand");
  if (g && hubByGroup[g]) toggleGroup(hubByGroup[g]);
}
computeWheel();
cam.k = skipIntro ? homeK : 2.2;
if (skipIntro) {
  endScanline(); clearInterval(dotsTimer);
  spawnAll(true);
  computeWheel();
  if (layoutMode === "galaxy") for (let i = 0; i < 260; i++) tick();
  else for (const n of nodes) { n.x = n.tx; n.y = n.ty; }
  cam.k = homeK;
  anim.mode = "idle";
} else {
  startIntro();
}
loop();
</script>
