<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap · OwnerOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%23ff6b4a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230b0e13'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    --bg: #0b0e13; --panel: rgba(18,21,28,.66); --card: rgba(23,27,35,.55);
    --card-solid: #171b23; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.05);
    --hover: rgba(255,255,255,.16);
    --text: #eceef2; --mut: #9aa2b1; --faint: #8b93a5;
    --accent: #ff6b4a; --accent-soft: rgba(255,107,74,.16);
    --accent-edge: rgba(255,107,74,.5); --accent-glow: rgba(255,107,74,.32);
    --ok: #2dd4a7; --warn: #e8b931; --bad: #ef5350; --info: #4a9eff;
    --blur: blur(18px) saturate(1.25);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Inter, sans-serif; font-size: 14px; min-height: 100vh;
    display: grid; grid-template-columns: 208px 1fr; overflow-x: hidden;
  }
  .stage {
    position: fixed; inset: 0; z-index: -2; background: var(--bg);
  }
  .stage img, .stage video {
    width: 100%; height: 100%; object-fit: cover; object-position: 70% 40%;
    display: block;
  }
  .stage::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(11,14,19,.96) 0%, rgba(11,14,19,.72) 30%,
        rgba(11,14,19,.18) 58%, rgba(11,14,19,.08) 78%, rgba(11,14,19,.42) 100%),
      linear-gradient(0deg, rgba(11,14,19,.65) 0%, transparent 22%),
      linear-gradient(180deg, rgba(11,14,19,.5) 0%, transparent 16%);
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  a { color: inherit; text-decoration: none; }

  aside {
    background: var(--panel); backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-right: 1px solid var(--line);
    padding: 22px 14px; display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh; z-index: 5;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px;
          font-weight: 700; font-size: 17px; letter-spacing: -.3px; }
  .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
                display: grid; place-items: center; box-shadow: 0 0 18px var(--accent-glow); }
  .logo .mark span { width: 12px; height: 12px; border-radius: 50%; background: var(--bg); }
  .logo em { font-style: normal; color: var(--accent); }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px;
    border-radius: 10px; color: var(--mut); font-weight: 500; font-size: 13.5px;
    border: 1px solid transparent; transition: color .15s, background .15s;
  }
  .nav-item:hover { color: var(--text); background: var(--card); }
  .nav-item.here { color: var(--text); background: var(--card);
                   border-color: var(--accent-edge);
                   box-shadow: 0 0 14px rgba(255,107,74,.14); }
  .nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none;
                  stroke-width: 1.7; flex-shrink: 0; }
  .side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line);
               display: grid; gap: 8px; }
  .sf-row { display: flex; align-items: center; gap: 8px; font-size: 11px;
            color: var(--faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--bad); }

  main { position: relative; min-height: 100vh; padding: 24px 34px 56px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 30px;
            flex-wrap: wrap; }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .datechip { font-size: 11px; color: var(--mut); background: var(--card);
              backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
              border: 1px solid var(--line); border-radius: 100px; padding: 6px 14px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            margin-left: auto;
            background: linear-gradient(135deg, var(--accent), #b3401f);
            display: grid; place-items: center; font-weight: 700; font-size: 14px;
            color: #fff; }

  .col { max-width: 640px; position: relative; z-index: 2; }
  .greet { margin-bottom: 26px; }
  .greet h2 { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .greet h2 .cursor { color: var(--accent); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .greet p { color: var(--mut); font-size: 13px; margin-top: 4px; }

  .glass {
    background: var(--card); backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.35);
  }
  .goals { display: grid; gap: 12px; }
  .goal {
    padding: 18px 20px; display: flex; align-items: center; gap: 16px;
    opacity: 0; animation: rise .4s ease forwards;
    transition: transform .25s cubic-bezier(.2,.9,.3,1.2), border-color .2s,
                box-shadow .25s;
  }
  .goal:hover { transform: translateY(-3px); border-color: var(--hover);
                box-shadow: 0 18px 44px rgba(0,0,0,.45); }
  .goal:first-child { border-color: var(--accent-edge);
                      box-shadow: 0 14px 40px rgba(0,0,0,.35),
                                  0 0 18px rgba(255,107,74,.14); }
  .goal:first-child:hover { border-color: var(--accent-edge);
                            box-shadow: 0 18px 44px rgba(0,0,0,.45),
                                        0 0 22px rgba(255,107,74,.2); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); }
                    to { opacity: 1; transform: none; } }
  .goal .tick {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--faint);
    transition: border-color .2s, box-shadow .2s;
  }
  .goal:hover .tick { border-color: var(--accent);
                      box-shadow: 0 0 10px var(--accent-glow); }
  .goal:first-child .tick { border-color: var(--accent);
                            box-shadow: 0 0 10px var(--accent-glow); }
  .goal .num { font-family: "JetBrains Mono", monospace; font-size: 12px;
               color: var(--faint); flex-shrink: 0; width: 24px; }
  .goal .who { min-width: 0; flex: 1; }
  .goal .gname { font-weight: 600; font-size: 14.5px; }
  .goal .gdesc { font-size: 12.5px; color: var(--mut); margin-top: 3px;
                 line-height: 1.5; }
  .btn { font-size: 11.5px; font-weight: 600; background: var(--accent); color: #fff;
         border: 0; border-radius: 100px; padding: 8px 16px; cursor: pointer;
         white-space: nowrap; flex-shrink: 0; font-family: Inter, sans-serif;
         transition: opacity .15s, color .15s, border-color .15s; }
  .btn:hover { opacity: .88; }
  .btn.ghost { background: rgba(255,255,255,.04); border: 1px solid var(--line);
               color: var(--mut); }
  .btn.ghost:hover { color: var(--text); border-color: var(--hover); opacity: 1; }
  .btn.ghost.copied { color: var(--ok); border-color: var(--ok); }

  .foot { margin-top: 22px; font-size: 12.5px;
          color: var(--faint); opacity: 0; animation: rise .4s ease forwards; }
  .err { color: var(--bad); font-size: 13px; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap;
            align-items: center; border-right: 0;
            border-bottom: 1px solid var(--line); }
    .logo { padding: 0 8px 0 0; } .side-foot { display: none; }
    main { padding: 20px 18px 44px; }
    .goal { flex-wrap: wrap; }
    .goal .who { flex-basis: 100%; order: 4; }
    .goal .btn { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .goal, .foot { animation: none; opacity: 1; }
    .greet .cursor { animation: none; }
    .stage video { display: none; }
    .stage img { display: block !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"><img src="/assets/seedpods.webp" alt="" id="stageImg"></div>
<aside>
  <div class="logo"><span class="mark"><span></span></span>Owner<em>OS_</em></div>
  <a class="nav-item" href="/today">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Today</a>
  <a class="nav-item" href="/projects">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Projects</a>
  <a class="nav-item" href="/brain">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg>
    Brain</a>
  <a class="nav-item" href="/capture">
    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><rect x="4" y="17" width="16" height="4" rx="1.5"/></svg>
    Capture</a>
  <a class="nav-item" href="/launch">
    <svg viewBox="0 0 24 24"><path d="M12 3c4 3 5 8 3 13l-3 5-3-5C7 11 8 6 12 3z"/><circle cx="12" cy="10" r="2"/></svg>
    Launch</a>
  <a class="nav-item" href="/plays">
    <svg viewBox="0 0 24 24"><path d="M4 4h12a2 2 0 0 1 2 2v14l-4-3-4 3-4-3-2 1.5V6a2 2 0 0 1 2-2z"/><path d="M8 9h6M8 13h4"/></svg>
    Plays</a>
  <a class="nav-item" href="/files">
    <svg viewBox="0 0 24 24"><path d="M13 3H6a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V9z"/><path d="M13 3v6h6.5"/></svg>
    Files</a>
  <a class="nav-item here" href="/roadmap">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 17c5-3 11 3 16 0M4 9c5-3 11 3 16 0"/></svg>
    Roadmap</a>
  <div class="side-foot">
    <div class="sf-row"><span class="dot" id="brainDot"></span><span id="brainState">brain: checking</span></div>
    <div class="sf-row"><span class="dot ok"></span>local · cabinet read-only</div>
  </div>
</aside>
<main>
  <div class="topbar">
    <h1>Roadmap</h1>
    <span class="datechip mono" id="dateChip"></span>
    <span class="avatar">J</span>
  </div>
  <div class="col">
    <div class="greet">
      <h2>Parked, on purpose<span class="cursor">_</span></h2>
      <p>Listed so they stop occupying your head. Nothing here is built.</p>
    </div>
    <div class="goals" id="goals"></div>
    <p class="foot" id="foot">Promote one when you are ready to build it.
      Your next build session knows where to look.</p>
  </div>
</main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const copy = (text, btn) => navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }).then(() => {
    const old = btn.textContent;
    btn.textContent = "Copied"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1200);
  });

  const ITEMS = [
    { name: "Workshop seat tracker",
      desc: "Seats sold, seats left, per workshop. Reads a simple sheet or capture notes." },
    { name: "Content calendar",
      desc: "What publishes where, this week and next. Feeds from the marketing crew skills." },
    { name: "Money snapshot",
      desc: "Cash position and invoices at a glance. NSE stays in units." },
    { name: "Client list",
      desc: "Who, where, last touch. A list, deliberately not a CRM." },
    { name: "Voice extras",
      desc: "Spoken answers on Capture and Today, reusing the Brain's voice pipeline." }
  ];

  function render() {
    document.getElementById("goals").innerHTML = ITEMS.map((it, i) =>
      '<div class="goal glass" style="animation-delay:' + (i * 70) + 'ms">' +
      '<span class="tick"></span>' +
      '<span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
      '<div class="who"><div class="gname">' + esc(it.name) +
      '</div><div class="gdesc">' + esc(it.desc) + '</div></div>' +
      '<button class="btn ghost" type="button" data-i="' + i + '">Promote</button>' +
      '</div>').join("");
    document.getElementById("foot").style.animationDelay =
      (ITEMS.length * 70 + 60) + "ms";
    document.querySelectorAll("[data-i]").forEach((b) =>
      b.addEventListener("click", () => {
        const n = Number(b.dataset.i) + 1;
        copy('claude "read /Users/jc/OS System/task_plan.md and build roadmap item ' +
          n + ': ' + ITEMS[n - 1].name + '"', b);
      }));
  }

  try {
    document.getElementById("dateChip").textContent =
      new Date().toLocaleDateString("en-AU",
        { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    render();
  } catch (err) {
    document.getElementById("goals").innerHTML =
      '<span class="err">Could not render the roadmap.</span>';
  }
  window.__ready = true;

  (async () => {
    try {
      const h = await (await fetch("/api/health")).json();
      document.getElementById("brainDot").className = "dot " + (h.brain ? "ok" : "bad");
      document.getElementById("brainState").textContent =
        h.brain ? "brain: live on 4880" : "brain: offline";
    } catch (e) {
      document.getElementById("brainDot").className = "dot bad";
      document.getElementById("brainState").textContent = "brain: offline";
    }
  })();
</script>
<script>fetch("/api/owner").then(function(r){return r.json()}).then(function(o){
  document.querySelectorAll(".avatar").forEach(function(a){a.textContent=o.initial;});
  var g=document.getElementById("ownerName"); if(g) g.textContent=o.name;
}).catch(function(){});</script>
</body>
</html>
