<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap · OwnerOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ffffff; --band: #f5f5f7; --navbg: rgba(250,250,252,.8);
    --wash: #e8e8ed; --hairline: #d6d6d6;
    --ink: #1d1d1f; --mid: #707070; --deep: #474747;
    --blue: #0071e3; --link: #0066cc; --ember: #b64400;
    --text: #1d1d1f; --mut: #707070; --faint: #707070;
    --accent: #b64400; --ok: #1d1d1f; --line: #d6d6d6;
  }
  * { margin: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui,
      "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.47; letter-spacing: -.022em;
    min-height: 100%;
  }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
          font-variant-numeric: tabular-nums; letter-spacing: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; letter-spacing: inherit; color: inherit;
           background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px;
                   border-radius: 4px; }
  .gnav { position: sticky; top: 0; z-index: 50; height: 44px;
          background: var(--navbg);
          backdrop-filter: blur(20px) saturate(1.8);
          -webkit-backdrop-filter: blur(20px) saturate(1.8); }
  .gnav-in { max-width: 1024px; margin: 0 auto; height: 100%;
             display: flex; align-items: center; gap: 28px; padding: 0 22px; }
  .gnav .word { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .gnav .word em { font-style: normal; color: var(--mid); font-weight: 400; }
  .gnav .links { display: flex; gap: 26px; margin: 0 auto; overflow-x: auto;
                 scrollbar-width: none; }
  .gnav .links::-webkit-scrollbar { display: none; }
  .gnav .links a { font-size: 12px; color: rgba(29,29,31,.8);
                   white-space: nowrap; transition: color .15s; }
  .gnav .links a:hover { color: var(--ink); }
  .gnav .links a.here { color: var(--ink); font-weight: 600; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid var(--ink); display: grid; place-items: center;
            font-size: 12px; font-weight: 600; }
  .band { padding: 88px 22px; }
  .band.gray { background: var(--band); }
  .band-in { max-width: 860px; margin: 0 auto; }
  .hero { text-align: center; padding-top: 72px; padding-bottom: 40px; }
  .hero.has-art {
    background:
      linear-gradient(rgba(255,255,255,1) 0%, rgba(255,255,255,.88) 34%,
        rgba(255,255,255,.35) 62%, rgba(255,255,255,0) 100%),
      url(/assets/apple/roadmap.png) center bottom / cover no-repeat;
    min-height: 72vh; padding-bottom: 40vh; }
  .datechip { font-family: ui-monospace, "SF Mono", Menlo, monospace;
              font-size: 12px; letter-spacing: .06em;
              text-transform: uppercase; color: var(--mid); }
  .greet h2 { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
              font-size: clamp(44px, 7vw, 80px); line-height: 1.05;
              font-weight: 700; letter-spacing: -.015em; margin-top: 14px; }
  .greet .cursor { color: var(--mid); font-weight: 400; }
  .greet p { font-size: 21px; color: var(--mid); margin-top: 16px;
             letter-spacing: .01em; }
  .plate { display: block; width: 100%; max-width: 980px; margin: 0 auto;
           border-radius: 28px; }
  .goals { display: grid; gap: 14px; }
  .goal { display: flex; gap: 20px; align-items: flex-start;
          background: var(--paper); border-radius: 28px; padding: 26px 30px; }
  .num { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
         font-size: 34px; font-weight: 700; color: var(--wash);
         -webkit-text-stroke: 1px var(--hairline); line-height: 1;
         flex-shrink: 0; min-width: 52px; }
  .who { flex: 1; min-width: 0; }
  .gname { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
           font-size: 21px; font-weight: 600; letter-spacing: -.005em; }
  .gdesc { font-size: 15px; color: var(--mid); margin-top: 6px;
           line-height: 1.5; }
  .tick { font-size: 13px; color: var(--link); white-space: nowrap; }
  .btn { background: var(--blue); color: #fff; border-radius: 980px;
         padding: 10px 22px; font-size: 15px; transition: background .15s; }
  .btn:hover { background: #0077ed; }
  .btn.ghost { background: transparent; color: var(--ink);
               border: 1px solid rgba(29,29,31,.8); }
  .btn.ghost:hover { background: var(--wash); }
  .err { color: var(--ember); }
  .foot-note { text-align: center; font-size: 14px; color: var(--mid);
               margin-top: 30px; }
  .foot { display: flex; align-items: center; justify-content: center;
          gap: 20px; padding: 26px 22px 40px; font-size: 12px;
          color: var(--mid); flex-wrap: wrap; }
  .sf-row { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--ink); }
  .dot.bad { background: var(--ember); }
  .stage { display: none !important; }
  @media (max-width: 720px) { .band { padding: 56px 18px; }
    .goal { flex-direction: column; gap: 10px; } }
  .glass.composer, .goal, .row, .dept, .roles-panel, .cat, .chain, .frow {
    box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 14px 34px rgba(0,0,0,.05); }

  .foot { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage" hidden><img src="/assets/seedpods.webp" alt="" id="stageImg"></div>
<nav class="gnav">
  <div class="gnav-in">
    <span class="word">OwnerOS<em>_</em></span>
    <div class="links">
      <a href="/today">Today</a>
      <a href="/projects">Projects</a>
      <a href="/brain">Brain</a>
      <a href="/capture">Capture</a>
      <a href="/launch">Workforce</a>
      <a href="/plays">Plays</a>
      <a href="/files">Files</a>
      <a class="here" href="/roadmap" aria-current="page">Roadmap</a>
    </div>
    <span class="avatar">J</span>
  </div>
</nav>
<main>
  <section class="band hero has-art">
    <div class="band-in">
      <div class="datechip mono" id="dateChip"></div>
      <div class="greet">
        <h2>Parked, on purpose<span class="cursor">_</span></h2>
        <p>Listed so they stop occupying your head. Nothing here is built.</p>
      </div>

      <div class="goals" id="goals"></div>
      <p class="foot-note" id="foot">Promote one when you are ready to build it.
        Your next build session knows where to look.</p>
    </div>
  </section>
</main>
<div class="foot">
  <span class="sf-row"><span class="dot" id="brainDot"></span><span id="brainState">brain: checking</span></span>
  <span class="sf-row"><span class="dot ok"></span>local · cabinet read-only</span>
</div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const copy = (text, btn) => navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }).then(() => {
    const old = btn.textContent;
    btn.textContent = "Copied"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1200);
  });

  const ITEMS = [
    { name: "Workshop seat tracker",
      desc: "Seats sold, seats left, per workshop. Reads a simple sheet or capture notes." },
    { name: "Content calendar",
      desc: "What publishes where, this week and next. Feeds from the marketing crew skills." },
    { name: "Money snapshot",
      desc: "Cash position and invoices at a glance. NSE stays in units." },
    { name: "Client list",
      desc: "Who, where, last touch. A list, deliberately not a CRM." },
    { name: "Voice extras",
      desc: "Spoken answers on Capture and Today, reusing the Brain's voice pipeline." }
  ];

  function render() {
    document.getElementById("goals").innerHTML = ITEMS.map((it, i) =>
      '<div class="goal glass" style="animation-delay:' + (i * 70) + 'ms">' +
      '<span class="tick"></span>' +
      '<span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
      '<div class="who"><div class="gname">' + esc(it.name) +
      '</div><div class="gdesc">' + esc(it.desc) + '</div></div>' +
      '<button class="btn ghost" type="button" data-i="' + i + '">Promote</button>' +
      '</div>').join("");
    document.getElementById("foot").style.animationDelay =
      (ITEMS.length * 70 + 60) + "ms";
    document.querySelectorAll("[data-i]").forEach((b) =>
      b.addEventListener("click", () => {
        const n = Number(b.dataset.i) + 1;
        copy('claude "read /Users/jc/OS System/task_plan.md and build roadmap item ' +
          n + ': ' + ITEMS[n - 1].name + '"', b);
      }));
  }

  try {
    document.getElementById("dateChip").textContent =
      new Date().toLocaleDateString("en-AU",
        { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    render();
  } catch (err) {
    document.getElementById("goals").innerHTML =
      '<span class="err">Could not render the roadmap.</span>';
  }
  window.__ready = true;

  (async () => {
    try {
      const h = await (await fetch("/api/health")).json();
      document.getElementById("brainDot").className = "dot " + (h.brain ? "ok" : "bad");
      document.getElementById("brainState").textContent =
        h.brain ? "brain: live on 4880" : "brain: offline";
    } catch (e) {
      document.getElementById("brainDot").className = "dot bad";
      document.getElementById("brainState").textContent = "brain: offline";
    }
  })();
</script>
<script>fetch("/api/owner").then(function(r){return r.json()}).then(function(o){
  document.querySelectorAll(".avatar").forEach(function(a){a.textContent=o.initial;});
  var g=document.getElementById("ownerName"); if(g) g.textContent=o.name;
}).catch(function(){});</script>
</body>
</html>
