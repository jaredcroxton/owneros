<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain · OwnerOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ffffff; --band: #f5f5f7; --navbg: rgba(250,250,252,.8);
    --wash: #e8e8ed; --hairline: #d6d6d6;
    --ink: #1d1d1f; --mid: #707070; --deep: #474747;
    --blue: #0071e3; --link: #0066cc; --ember: #b64400;
    --text: #1d1d1f; --mut: #707070; --faint: #707070;
    --accent: #b64400; --ok: #1d1d1f; --line: #d6d6d6;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui,
      "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.47; letter-spacing: -.022em;
    display: flex; flex-direction: column;
  }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
          font-variant-numeric: tabular-nums; letter-spacing: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0;
           cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px;
                   border-radius: 4px; }
  .gnav { position: sticky; top: 0; z-index: 50; height: 44px; flex-shrink: 0;
          background: var(--navbg);
          backdrop-filter: blur(20px) saturate(1.8);
          -webkit-backdrop-filter: blur(20px) saturate(1.8); }
  .gnav-in { max-width: 1024px; margin: 0 auto; height: 100%;
             display: flex; align-items: center; gap: 28px; padding: 0 22px; }
  .gnav .word { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .gnav .word em { font-style: normal; color: var(--mid); font-weight: 400; }
  .gnav .links { display: flex; gap: 26px; margin: 0 auto; overflow-x: auto;
                 scrollbar-width: none; min-width: 0; }
  .gnav .links::-webkit-scrollbar { display: none; }
  .gnav .links a { font-size: 12px; color: rgba(29,29,31,.8);
                   white-space: nowrap; transition: color .15s; }
  .gnav .links a:hover { color: var(--ink); }
  .gnav .links a.here { color: var(--ink); font-weight: 600; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid var(--ink); display: grid; place-items: center;
            font-size: 12px; font-weight: 600; }
  .statusbar { display: flex; align-items: center; justify-content: center;
               gap: 18px; padding: 10px 22px; font-size: 12px;
               color: var(--mid); flex-shrink: 0; }
  .livechip { display: inline-flex; align-items: center; gap: 7px; }
  .datechip { font-family: ui-monospace, "SF Mono", Menlo, monospace;
              font-size: 12px; letter-spacing: .06em;
              text-transform: uppercase; color: var(--mid); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--ink); }
  .dot.bad { background: var(--ember); }
  .sf-row { display: inline-flex; align-items: center; gap: 7px; }
  .viewport { flex: 1; min-height: 0; display: flex; flex-direction: column;
              padding: 0 22px 22px; }
  .viewport iframe { flex: 1; border: 0; width: 100%; min-height: 0;
                     border-radius: 28px; background: var(--band);
                     opacity: 0; transition: opacity .4s; }
  .viewport iframe.on { opacity: 1; }
  .down-wrap { flex: 1; display: flex; align-items: center;
               justify-content: center; }
  .down { text-align: center; max-width: 480px; padding: 40px; }
  .down .glyph { font-size: 44px; margin-bottom: 14px; }
  .down h2 { font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
             font-size: 28px; font-weight: 700; letter-spacing: -.005em; }
  .down p { font-size: 15px; color: var(--mid); margin-top: 10px;
            line-height: 1.5; }
  .codechip { font-family: ui-monospace, "SF Mono", Menlo, monospace;
              font-size: 12px; background: var(--band); border-radius: 10px;
              padding: 10px 14px; display: inline-block; margin-top: 14px; }
  .btn { display: inline-block; background: var(--blue); color: #fff;
         border-radius: 980px; padding: 10px 22px; font-size: 15px;
         margin-top: 16px; transition: background .15s; }
  .btn:hover { background: #0077ed; }
  .pill { font-size: 12px; color: var(--mid); }
  .foot { font-size: 12px; color: var(--mid); margin-top: 14px; }
  .stage-bg { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .viewport iframe { transition: none; } }
</style>
</head>
<body>
<div class="stage-bg" id="bgStage" hidden><img src="/assets/galaxy.webp" alt="" id="stageImg"></div>
<nav class="gnav">
  <div class="gnav-in">
    <span class="word">OwnerOS<em>_</em></span>
    <div class="links">
      <a href="/today">Today</a>
      <a href="/projects">Projects</a>
      <a class="here" href="/brain" aria-current="page">Brain</a>
      <a href="/capture">Capture</a>
      <a href="/launch">Workforce</a>
      <a href="/plays">Plays</a>
      <a href="/personas">Personas</a>
      <a href="/hermes">Hermes</a>
      <a href="/sessions">Sessions</a>
      <a href="/files">Files</a>
      <a href="/roadmap">Roadmap</a>
    </div>
    <span class="avatar">J</span>
  </div>
</nav>
<div class="statusbar">
  <span class="datechip mono" id="dateChip"></span>
  <span class="livechip" id="liveChip"><span class="dot" id="liveDot"></span><span id="liveText">checking</span></span>
  <span class="sf-row"><span class="dot" id="brainDot"></span><span id="brainState">brain: checking</span></span>
</div>
<main class="viewport" id="stage"></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const copy = (text, btn) => navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }).then(() => {
    const old = btn.textContent; btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = old; }, 1200);
  });

  document.getElementById("dateChip").textContent =
    new Date().toLocaleDateString("en-AU",
      { weekday: "short", day: "numeric", month: "short", year: "numeric" });

  const LOAD_CMD = "launchctl load ~/Library/LaunchAgents/com.jared.secondbrain.plist";

  function setStatus(live) {
    document.getElementById("brainDot").className = "dot " + (live ? "ok" : "bad");
    document.getElementById("brainState").textContent =
      live ? "brain: live on 4880" : "brain: offline";
    const chip = document.getElementById("liveChip");
    chip.className = "livechip " + (live ? "ok" : "bad");
    document.getElementById("liveDot").style.background =
      live ? "var(--ok)" : "var(--bad)";
    document.getElementById("liveDot").style.boxShadow =
      live ? "0 0 8px var(--ok)" : "none";
    document.getElementById("liveText").textContent = live ? "live" : "offline";
  }

  function showOffline(stage, port) {
    stage.innerHTML =
      '<div class="down-wrap"><div class="down">' +
      '<div class="glyph"><svg viewBox="0 0 24 24">' +
      '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>' +
      '<path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg></div>' +
      '<span class="pill"><span class="dot" style="background:var(--bad)"></span>offline</span>' +
      '<h2>The Brain is offline.</h2>' +
      '<p>The Second Brain LaunchAgent is not answering on ' +
      '<span class="mono" style="color:var(--text)">' + esc(port) + '</span>. ' +
      'Reload it, then refresh this page.</p>' +
      '<div class="codechip"><code>' + esc(LOAD_CMD) + '</code>' +
      '<button class="btn" type="button" id="copyCmd">Copy</button></div>' +
      '<div class="foot">Once it answers, this page embeds the live memory map.</div>' +
      '</div></div>';
    document.getElementById("copyCmd").addEventListener("click",
      (e) => copy(LOAD_CMD, e.currentTarget));
  }

  async function load() {
    const stage = document.getElementById("stage");
    let health = { brain: false, brain_url: "http://localhost:4880" };
    try { health = await (await fetch("/api/health")).json(); } catch (err) {}
    try {
      setStatus(!!health.brain);
      if (health.brain) {
        const frame = document.createElement("iframe");
        frame.src = (health.brain_url || "http://localhost:4880") + "?theme=light";
        frame.title = "Second Brain map";
        frame.addEventListener("load", () => {
          frame.classList.add("on");
          window.__ready = true;
        });
        stage.appendChild(frame);
        setTimeout(() => {
          frame.classList.add("on");
          window.__ready = true;
        }, 4000);
      } else {
        showOffline(stage, "localhost:4880");
        window.__ready = true;
      }
    } catch (err) {
      showOffline(stage, "localhost:4880");
      window.__ready = true;
    }
  }
  load();
</script>
<script>fetch("/api/owner").then(function(r){return r.json()}).then(function(o){
  document.querySelectorAll(".avatar").forEach(function(a){a.textContent=o.initial;});
  var g=document.getElementById("ownerName"); if(g) g.textContent=o.name;
}).catch(function(){});</script>
</body>
</html>
